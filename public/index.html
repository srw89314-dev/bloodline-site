/* ---------- character creation ---------- */
function newCharacter(eraIndex, name, inherited){
  const era = ERAS[eraIndex];
  const base = { health: randInt(55,85), happiness: randInt(50,80), smarts: randInt(35,70), looks: randInt(35,70), imagination: randInt(25,55), strength: randInt(35,70), agility: randInt(35,70) };
  if(inherited && inherited.bonusStat) base[inherited.bonusStat] = clamp(base[inherited.bonusStat] + 15);
  if(inherited && inherited.minusStat) base[inherited.minusStat] = clamp(base[inherited.minusStat] - 15);
  const startMoney = inherited && inherited.money != null ? inherited.money : randInt(...era.moneyRange);
  const surname = deriveSurname(name);
  const fam = makeFamily(era.id, surname);
  const c = {
    name, eraIndex, age:0, stats:base, money:Math.round(startMoney), savings:0,
    job:null, salary:0, jobTenure:0, secondJob:null, secondSalary:0,
    alive:true, events:[], generation: state.generation,
    relationships:[], owned:[], actionUsage:{}, surname, _usedText:{},
    skills:{ sports:0, martialArts:0, academic:0, arts:0 },
    sportsStage:null, sportsStageReps:0, sportsProTierIdx:0,
    creditScore:null, loans:[],
    degrees:[], enrolled:null, degreeCooldowns:{},
  };
  fam.rels.forEach(r=>addRelationship(c, r.role, r.name, r.species?{species:r.species}:null));
  return c;
}

/* ---------- effect application ---------- */
function applyEffectSpec(c, spec, rel){
  const deltas = {};
  ['health','happiness','smarts','looks','imagination','strength','agility','money'].forEach(k=>{
    if(spec[k] !== undefined) deltas[k] = rollRange(spec[k]);
  });
  if(spec.health) c.stats.health = clamp(c.stats.health + deltas.health);
  if(spec.happiness) c.stats.happiness = clamp(c.stats.happiness + deltas.happiness);
  if(spec.smarts) c.stats.smarts = clamp(c.stats.smarts + deltas.smarts);
  if(spec.looks) c.stats.looks = clamp(c.stats.looks + deltas.looks);
  if(spec.imagination) c.stats.imagination = clamp((c.stats.imagination||0) + deltas.imagination);
  if(spec.strength) c.stats.strength = clamp((c.stats.strength||0) + deltas.strength);
  if(spec.agility) c.stats.agility = clamp((c.stats.agility||0) + deltas.agility);
  if(spec.money) c.money = Math.max(0, Math.round(c.money + deltas.money));
  if(rel && spec.closeness !== undefined){
    rel.closeness = clamp(rel.closeness + rollRange(spec.closeness));
  } else if(rel){
    rel.closeness = clamp(rel.closeness + 3); // small default bump for any interaction
  }
  return deltas;
}

function logEvent(c, text, cls, milestone, legendary){
  c.events.unshift({ text, cls: milestone ? 'milestone' : (cls||''), tag:`Age ${c.age}`, legendary: !!legendary });
}

function eventClassFromDeltas(d){
  const total = (d.health||0)+(d.happiness||0)+(d.smarts||0)+(d.looks||0)+((d.money||0)/10);
  if(total > 1) return 'good';
  if(total < -1) return 'bad';
  return '';
}

/* ---------- physical stat decay ----------
   Strength and Agility decline naturally with age, same idea as Health's
   existing post-60 drift above — this is deliberately the ONLY mechanism
   that phases a character out of a physically demanding job (no hardcoded
   age cutoff on top of it). Starts softly at 50, steeper past 65, so a
   character who keeps training can hold onto a physical job longer than
   one who doesn't. */
function applyPhysicalDecay(c){
  if(c.age < 50) return;
  const rate = c.age >= 65 ? [2,5] : [1,3];
  c.stats.strength = clamp((c.stats.strength||0) - randInt(...rate));
  c.stats.agility = clamp((c.stats.agility||0) - randInt(...rate));
}

/* ---------- economy: savings interest + investing ---------- */
const ERA_INTEREST_RATE = { wildwest:0.015, twenties:0.02, postwar:0.025, modern:0.02, future:0.03 };
function applyEconomyInterest(c){
  if(c.savings > 0){
    const rate = ERA_INTEREST_RATE[ERAS[c.eraIndex].id] || 0.02;
    c.savings += Math.max(1, Math.round(c.savings * rate));
  }
}
// Weighted random investment outcome — mostly modest, occasionally a big win or a real loss.
function investOutcome(){
  const roll = Math.random();
  if(roll < 0.30) return { mult: -(randInt(30,70)/100), tag:'bad' };
  if(roll < 0.65) return { mult: (randInt(-10,10)/100), tag:'flat' };
  if(roll < 0.92) return { mult: (randInt(20,80)/100), tag:'good' };
  return { mult: (randInt(90,200)/100), tag:'great' };
}

/* ---------- skill progression ---------- */
// Real rank/level progression instead of a flat stat bump — tied to repeated
// practice of the same action, not a generic number going up in isolation.
const SKILL_ACTION_MAP = {
  join_sport:'sports', varsity:'sports', college_athletics:'sports', pro_athletics:'sports',
  martial_arts:'martialArts', martial_arts_t:'martialArts',
  study:'academic', study_hard:'academic', take_class:'academic',
  join_arts:'arts', band_arts:'arts',
};
const SPORTS_TIERS = ['Beginner','Developing','Solid Player','Skilled','Standout','Elite'];
const MARTIAL_ARTS_BELTS = ['White Belt','Yellow Belt','Orange Belt','Green Belt','Blue Belt','Purple Belt','Brown Belt','Black Belt'];
const ACADEMIC_TIERS = ['No Focus','Developing Student','Solid Student','Honor Student','Scholar','Prodigy'];
const ARTS_TIERS = ['Just Starting','Developing Talent','Skilled Creative','Accomplished Artist','Standout Talent','Master Artist'];
function skillTier(tiers, reps, perTier){
  const idx = Math.min(tiers.length - 1, Math.floor((reps||0) / perTier));
  return tiers[idx];
}

/* ---------- sports activity ladder: school -> college -> pro ----------
   A separate, stage-aware progression layered on top of the Sports skill
   counter above. Any sports practice before adulthood starts the ladder at
   'school'; reaching at least Varsity by 18 carries it into 'college', and
   reaching All-American by 22 carries it into 'pro' — where it becomes the
   character's actual job, with pay that scales hard by tier. Falling short
   at either checkpoint just ends the ladder there; the character moves on
   to a standard job like anyone else (see assignStandardJob above). */
const SCHOOL_SPORTS_TIERS = ['JV','Varsity','Captain'];
const COLLEGE_SPORTS_TIERS = ['Varsity','All-Conference','All-American'];
const PRO_SPORTS_TIERS = ['Rookie','Starter','All-Star','MVP','Hall of Fame'];
const SPORTS_LADDER_PER_TIER = 4; // reps needed to advance one tier within a stage
const PRO_SPORTS_SALARY_MULT = [1.5, 2.5, 4, 7, 12]; // x era's average salary, per pro tier
function sportsLadderTiers(stage){
  return stage === 'school' ? SCHOOL_SPORTS_TIERS : stage === 'college' ? COLLEGE_SPORTS_TIERS : stage === 'pro' ? PRO_SPORTS_TIERS : null;
}
function sportsLadderTier(stage, reps){
  const tiers = sportsLadderTiers(stage);
  if(!tiers) return null;
  const idx = Math.min(tiers.length - 1, Math.floor((reps||0) / SPORTS_LADDER_PER_TIER));
  return { label: tiers[idx], idx };
}
function eraAvgMoney(era){ return (era.moneyRange[0]+era.moneyRange[1])/2; }
function checkProTierAdvance(c){
  const era = ERAS[c.eraIndex];
  const tier = sportsLadderTier('pro', c.sportsStageReps);
  if(!tier) return;
  const prevIdx = c.sportsProTierIdx||0;
  if(tier.idx > prevIdx){
    c.sportsProTierIdx = tier.idx;
    c.salary = Math.round(eraAvgMoney(era) * PRO_SPORTS_SALARY_MULT[tier.idx]);
    c.job = `${PRO_SPORTS_TIERS[tier.idx]} Pro Athlete`;
    c.jobTenure = 0;
    logEvent(c, `${firstName(c.name)} was promoted to ${PRO_SPORTS_TIERS[tier.idx]} — the paycheck to match.`, 'good', true);
  }
}
// Called at the age-18 and age-22 checkpoints (see applyMilestones) to
// decide whether the ladder continues into the next stage or ends here.
function advanceSportsStage(c){
  if(c.sportsStage === 'school'){
    const tier = sportsLadderTier('school', c.sportsStageReps);
    if(tier && tier.idx >= 1){ // reached at least Varsity
      c.sportsStage = 'college'; c.sportsStageReps = 0;
    } else {
      c.sportsStage = null;
    }
  } else if(c.sportsStage === 'college'){
    const tier = sportsLadderTier('college', c.sportsStageReps);
    if(tier && tier.idx >= 2){ // reached All-American
      const era = ERAS[c.eraIndex];
      c.sportsStage = 'pro'; c.sportsStageReps = 0; c.sportsProTierIdx = 0;
      c.job = `${PRO_SPORTS_TIERS[0]} Pro Athlete`;
      c.salary = Math.round(eraAvgMoney(era) * PRO_SPORTS_SALARY_MULT[0]);
      c.jobTenure = 0;
      if(!relByRole(c,'boss')) addRelationship(c, 'boss', pick(BOSS_NAMES));
    } else {
      c.sportsStage = null;
    }
  }
}

function recordSkillPractice(c, actionId){
  const key = SKILL_ACTION_MAP[actionId];
  if(!key) return;
  if(!c.skills) c.skills = { sports:0, martialArts:0, academic:0, arts:0 };
  c.skills[key] = (c.skills[key]||0) + 1;
  if(key === 'sports'){
    if(!c.sportsStage && c.age < 18){ c.sportsStage = 'school'; c.sportsStageReps = 0; }
    if(c.sportsStage){
      c.sportsStageReps = (c.sportsStageReps||0) + 1;
      if(c.sportsStage === 'pro') checkProTierAdvance(c);
    }
  }
}
function skillsHtml(c){
  if(!c.skills) return '';
  const rows = [];
  if(c.skills.sports > 0) rows.push(`<div>Sports: <strong>${skillTier(SPORTS_TIERS, c.skills.sports, 4)}</strong></div>`);
  if(c.sportsStage){
    const tier = sportsLadderTier(c.sportsStage, c.sportsStageReps);
    const stageLabel = c.sportsStage === 'school' ? 'School Athletics' : c.sportsStage === 'college' ? 'College Athletics' : 'Pro Athletics';
    if(tier) rows.push(`<div>${stageLabel}: <strong>${tier.label}</strong></div>`);
  }
  if(c.skills.martialArts > 0) rows.push(`<div>Martial Arts: <strong>${skillTier(MARTIAL_ARTS_BELTS, c.skills.martialArts, 3)}</strong></div>`);
  if(c.skills.academic > 0) rows.push(`<div>Academic Track: <strong>${skillTier(ACADEMIC_TIERS, c.skills.academic, 4)}</strong></div>`);
  if((c.skills.arts||0) > 0) rows.push(`<div>Arts: <strong>${skillTier(ARTS_TIERS, c.skills.arts, 4)}</strong></div>`);
  if(!rows.length) return '';
  return `<div class="skills-box divider"><h4>Skills</h4>${rows.join('')}</div>`;
}

/* ---------- special action handlers ---------- */
function handleSpecial(c, special, action){
  const era = ERAS[c.eraIndex];
  if(special === 'make_friend' && !relByRole(c,'bestfriend')){
    const name = firstNameForEra(era.id)+' '+pick(LAST_NAMES);
    addRelationship(c, 'bestfriend', name);
    logEvent(c, `${firstName(c.name)} became close friends with ${firstName(name)}.`, 'good');
  } else if(special === 'find_partner' && !relByRole(c,'partner')){
    const name = firstNameForEra(era.id)+' '+pick(LAST_NAMES);
    addRelationship(c, 'partner', name);
    logEvent(c, `${firstName(c.name)} started seeing ${firstName(name)}.`, 'good');
  } else if(special === 'teen_job' && !c.job){
    const job = bestQualifyingTeenJob(c, era.id);
    c.job = job.title; c.salary = randInt(8,25);
    addRelationship(c, 'boss', pick(BOSS_NAMES));
    logEvent(c, `${firstName(c.name)} got a part-time job as a ${job.title}.`, 'good');
  } else if(special === 'second_job' && c.job && !c.secondJob){
    const title = anyJobTitle(era.id);
    c.secondJob = title;
    c.secondSalary = Math.round(randInt(...era.moneyRange) * 0.35 + 10);
    logEvent(c, `${firstName(c.name)} took on a second job as a ${title}, on top of everything else.`, '');
  } else if(special === 'enroll_degree'){
    const options = (DEGREE_TYPES[era.id]||[]).filter(d => c.age >= d.minAge && !hasDegree(c,d.id) && !degreeOnCooldown(c,d.id) && !c.enrolled);
    if(!options.length){
      logEvent(c, `${firstName(c.name)} looked into training options but nothing new was available right now.`, '');
    } else {
      const listText = options.map((d,i)=>`${i+1}. ${d.label} — ${d.years} yr, $${d.cost}`).join('\n');
      const input = prompt(`Choose training to pursue (type the number):\n${listText}`, '1');
      const idx = parseInt(input, 10) - 1;
      const choice = options[idx];
      if(!choice){
        logEvent(c, `${firstName(c.name)} thought about pursuing training but didn't commit to anything.`, '');
      } else if(c.money < choice.cost){
        logEvent(c, `${firstName(c.name)} wanted to enroll in ${choice.label.toLowerCase()} but couldn't afford the $${choice.cost} cost.`, '');
      } else {
        c.money -= choice.cost;
        c.enrolled = { id: choice.id, yearsLeft: choice.years, yearsTotal: choice.years };
        c.job = null; c.secondJob = null; c.secondSalary = 0; // full-time training, same as the sports-college branch
        logEvent(c, `${firstName(c.name)} enrolled in ${choice.label.toLowerCase()} — ${choice.years} years of hard work ahead.`, 'good');
      }
    }
  } else if(special === 'quit_second_job' && c.secondJob){
    logEvent(c, `${firstName(c.name)} quit the second job as a ${c.secondJob} — one less thing to juggle.`, '');
    c.secondJob = null; c.secondSalary = 0;
  } else if(special === 'deposit_savings'){
    const maxAmt = Math.floor(c.money);
    if(maxAmt < 1){
      logEvent(c, `${firstName(c.name)} didn't have any spare cash to put away this year.`, '');
    } else {
      // Player picks the amount now instead of a fixed 50% — clamped to
      // what's actually on hand so this can never go negative.
      const input = prompt(`How much would you like to move into savings? (You have $${maxAmt.toLocaleString()} on hand)`, String(Math.floor(maxAmt * 0.5)));
      const amount = Math.min(maxAmt, Math.max(0, Math.floor(Number(input))));
      if(input === null || !amount || isNaN(amount)){
        logEvent(c, `${firstName(c.name)} thought about saving some money but didn't get around to it.`, '');
      } else {
        c.money -= amount; c.savings = (c.savings||0) + amount;
        logEvent(c, `${firstName(c.name)} tucked $${amount.toLocaleString()} away into savings.`, 'good');
      }
    }
  } else if(special === 'withdraw_savings'){
    const maxAmt = Math.floor(c.savings || 0);
    if(maxAmt <= 0){
      logEvent(c, `${firstName(c.name)} checked their savings — there wasn't anything there yet.`, '');
    } else {
      const input = prompt(`How much would you like to withdraw from savings? (You have $${maxAmt.toLocaleString()} saved)`, String(maxAmt));
      const amount = Math.min(maxAmt, Math.max(0, Math.floor(Number(input))));
      if(input === null || !amount || isNaN(amount)){
        logEvent(c, `${firstName(c.name)} decided to leave their savings alone for now.`, '');
      } else {
        c.savings -= amount; c.money += amount;
        logEvent(c, `${firstName(c.name)} pulled $${amount.toLocaleString()} out of savings.`, '');
      }
    }
  } else if(special === 'marry' && action && action.rel && !action.rel.married){
    action.rel.married = true;
    action.rel.closeness = clamp(action.rel.closeness + 15);
    logEvent(c, `${firstName(c.name)} and ${firstName(action.rel.name)} got married!`, 'good', true);
  } else if(special === 'invest'){
    const stake = (action && action.cost) || 0;
    const outcome = investOutcome();
    const change = Math.round(stake * outcome.mult);
    // The stake was already deducted from money as this action's cost before
    // handleSpecial ran (see performAction). Investing should return principal
    // plus gain/loss, not just the gain on top of an already-spent stake — the
    // old version made "good"/"flat" outcomes net losses despite the message
    // saying the investment "paid off." Net effect on money is now exactly `change`.
    c.money = Math.max(0, c.money + stake + change);
    let text;
    if(outcome.tag === 'bad') text = `${firstName(c.name)}'s investment went south — lost $${Math.abs(change)}.`;
    else if(outcome.tag === 'flat') text = `${firstName(c.name)}'s investment barely moved either way.`;
    else if(outcome.tag === 'good') text = `${firstName(c.name)}'s investment paid off nicely — up $${change}.`;
    else { text = `${firstName(c.name)}'s investment paid off big — up $${change}!`; c.hadGreatInvestment = true; }
    logEvent(c, text, change > 5 ? 'good' : (change < -5 ? 'bad' : ''));
  }
}

/* ---------- building the action menu ---------- */
// Some actions read/say something different depending on era (e.g. no
// belt-ranked "martial arts" or "varsity" sports in the Wild West) without
// needing a whole separate action entry — this merges in the era-specific
// label/texts when present, otherwise returns the action def unchanged.
function eraVariant(def, eraId){
  const o = def.eraOverrides && def.eraOverrides[eraId];
  return o ? Object.assign({}, def, o) : def;
}
function buildActionMenu(c){
  const bracket = ageBracket(c.age);
  const era = ERAS[c.eraIndex];
  const actions = [];

  c.relationships.filter(r=>r.active).forEach(rel=>{
    const defs = ROLE_ACTIONS[rel.role] || [];
    defs.forEach(def=>{
      if(def.minAge && c.age < def.minAge) return;
      if(def.maxAge && c.age > def.maxAge) return;
      if(def.special === 'marry' && rel.married) return;
      actions.push({ def, rel, key: def.id+'_'+rel.id,
        label: fill(def.label, c, rel), category: def.category, cost: def.cost||0 });
    });
  });

  (BRACKET_ACTIONS[bracket]||[]).forEach(def=>{
    if(def.special === 'find_partner' && relByRole(c,'partner')) return;
    if(def.special === 'make_friend' && relByRole(c,'bestfriend')) return;
    if(def.special === 'teen_job' && c.job) return;
    if(def.special === 'second_job' && (!c.job || c.secondJob)) return;
    if(def.special === 'quit_second_job' && !c.secondJob) return;
    if(def.special === 'enroll_degree' && (c.enrolled || !degreeOptionsAvailable(c, era.id))) return;
    if(def.requiresSportsStage && c.sportsStage !== def.requiresSportsStage) return;
    if(def.minAge && c.age < def.minAge) return;
    // minSmarts/minImagination: content that only opens up once a character
    // has built up that stat, so smarts/imagination gate real opportunities
    // instead of just being numbers that go up in isolation.
    if(def.minSmarts && (c.stats.smarts||0) < def.minSmarts) return;
    if(def.minImagination && (c.stats.imagination||0) < def.minImagination) return;
    const vdef = eraVariant(def, era.id);
    actions.push({ def: vdef, rel:null, key: def.id, label: fill(vdef.label, c, null), category: vdef.category, cost: vdef.cost||0 });
  });

  const eraDefs = (ERA_BRACKET_ACTIONS[era.id]||{})[bracket] || [];
  eraDefs.forEach(def=>{
    actions.push({ def, rel:null, key: def.id, label: fill(def.label, c, null), category: def.category, cost: def.cost||0 });
  });

  if(bracket === 'adult'){
    BRACKET_ACTIONS.adult.forEach(()=>{}); // no-op, already added above
  }

  (SHOP_ITEMS[era.id]||[]).forEach(item=>{
    if(c.age < item.minAge || c.owned.includes(item.id)) return;
    actions.push({
      shopItem:item, rel:null, key:'buy_'+item.id,
      label:`Buy: ${item.label}`, category:'Shop', cost:item.cost,
    });
    // Financing is a second way to get the same item — only offered to
    // adults with a credit history good enough that a lender would actually
    // say yes. Cost gates on the down payment, not the sticker price; the
    // rest becomes a loan (see startLoan) at a rate set by creditScore.
    if(item.financeable && c.age >= 18 && c.creditScore != null && c.creditScore >= CREDIT_DENY_THRESHOLD){
      const downPayment = Math.round(item.cost * 0.2);
      actions.push({
        financeItem:item, rel:null, key:'finance_'+item.id,
        label:`Finance: ${item.label} (${Math.round(downPayment)} down)`, category:'Shop', cost:downPayment,
      });
    }
  });

  return actions;
}

// Categories that represent skill-building / academic practice can be repeated
// up to 5x per year; everything else can be chosen once per year (but every
// available option can be chosen, not just a handful).
const SKILL_CATEGORIES = ['School', 'Activities', 'Growth'];
function actionCap(category){ return SKILL_CATEGORIES.includes(category) ? 5 : 1; }
function actionUsageCount(c, key){ return c.actionUsage[key] || 0; }

function performAction(c, action){
  const cap = actionCap(action.category);
  const used = actionUsageCount(c, action.key);
  if(used >= cap) return;
  if(action.cost && c.money < action.cost) return;
  const def = action.def;

  if(action.financeItem){
    const item = action.financeItem;
    startLoan(c, item);
    const loan = c.loans[c.loans.length-1];
    logEvent(c, `${firstName(c.name)} financed ${item.label.toLowerCase()} — $${loan.payment.toLocaleString()}/yr for ${loan.years} years at ${Math.round(loan.rate*1000)/10}%.`, '');
    c.actionUsage[action.key] = used + 1;
    renderGame();
    return;
  }

  if(action.shopItem){
    c.money -= action.cost;
    c.owned.push(action.shopItem.id);
    applyEffectSpec(c, action.shopItem.effect, null);
    logEvent(c, `${firstName(c.name)} bought ${action.shopItem.label.toLowerCase()}.`, 'good');
    c.actionUsage[action.key] = used + 1;
    renderGame();
    return;
  }

  if(action.cost) c.money = Math.max(0, c.money - action.cost);
  const deltas = applyEffectSpec(c, def.effect || {}, action.rel);
  if(def.special){
    handleSpecial(c, def.special, action);
  } else if(def.requiresJob && !c.job){
    // no job, action fizzles softly
    logEvent(c, `${firstName(c.name)} looked for extra work but didn't have a job to lean on.`, '');
  } else if(def.texts && def.texts.length){
    const text = fill(pickText(c, def.id+(action.rel?('_'+action.rel.id):''), def.texts), c, action.rel);
    logEvent(c, text, eventClassFromDeltas(deltas));
  }
  recordSkillPractice(c, def.id);
  c.actionUsage[action.key] = used + 1;
  renderGame();
}

/* ---------- milestones & aging ---------- */
function applyMilestones(c){
  const era = ERAS[c.eraIndex];
  if(c.age === 0){ logEvent(c, `${firstName(c.name)} was born.`, '', true); }
  if(c.age === 1){
    logEvent(c, `${firstName(c.name)} took their first steps.`, '', true);
    logEvent(c, `${firstName(c.name)} said their first word.`, '', true);
  }
  if(c.age === 5){
    logEvent(c, `${firstName(c.name)} started school.`, '', true);
    if(!relByRole(c,'teacher')) addRelationship(c, 'teacher', pick(TEACHER_NAMES));
    if(!relByRole(c,'bestfriend')) addRelationship(c, 'bestfriend', firstNameForEra(era.id)+' '+pick(LAST_NAMES));
  }
  if(c.age === 18){
    c.creditScore = STARTING_CREDIT_SCORE;
    c.relationships.filter(r=>r.role==='teacher').forEach(r=>r.active=false);
    advanceSportsStage(c);
    if(c.sportsStage === 'college'){
      logEvent(c, `${firstName(c.name)} became an adult and headed off to compete in college athletics.`, '', true);
    } else if(c.enrolled){
      logEvent(c, `${firstName(c.name)} became an adult, already deep into their training — the job hunt can wait.`, '', true);
    } else {
      const { title, tier } = assignStandardJob(c);
      const msg = tier === 'desirable'
        ? `${firstName(c.name)}'s hard work opened doors — they became an adult and landed a competitive job as a ${title}.`
        : `${firstName(c.name)} became an adult and took a job as a ${title}.`;
      logEvent(c, msg, '', true);
    }
  }
  // College athletics either turns pro (advanceSportsStage handles the pay
  // and job title) or wraps up without a pro career, in which case the
  // character takes a standard job now instead — four years later than
  // everyone else, since they were busy competing instead of working.
  if(c.age === 22 && c.sportsStage === 'college'){
    advanceSportsStage(c);
    if(c.sportsStage !== 'pro'){
      const { title } = assignStandardJob(c);
      logEvent(c, `${firstName(c.name)}'s college athletic career wound down without a pro contract — they took a job as a ${title} instead.`, '', true);
    }
  }
  if(c.age === 65 && c.job){
    logEvent(c, `${firstName(c.name)} retired after years as a ${c.job}.`, '', true);
    c.job = null;
    if(c.sportsStage === 'pro') c.sportsStage = null;
    if(c.secondJob){ c.secondJob = null; c.secondSalary = 0; }
    c.relationships.filter(r=>r.role==='boss'||r.role==='coworker').forEach(r=>r.active=false);
  }
}

function deathCheck(c){
  if(c.stats.health <= 0) return true;
  let chance = 0;
  if(c.age > 60) chance += (c.age-60) * 0.012;
  chance += 0.004;
  if(c.stats.health < 25) chance += 0.05;
  return Math.random() < chance;
}

/* ---------- turn resolution: 6-month / 1-year time-skip ---------- */
// c.monthsIntoYear tracks progress toward completing the current age year
// (0 or 6; undefined on older saves is treated as 0). Advancing 6 months that
// doesn't cross into a new year is a lighter "check-in" turn — no salary, no
// milestones, no legendary/story roll, just a fresh set of actions and a
// smaller chance of an ordinary event. Advancing into a new year (either via
// a 1-year jump, or a second 6-month step) runs the full year-end resolution.
function advanceTurn(months){
  const c = state.char;
  if(!c || !c.alive) return;
  c.monthsIntoYear = (c.monthsIntoYear||0) + months;
  if(c.monthsIntoYear >= 12){
    c.monthsIntoYear -= 12;
    c.age += 1;
    completeYear(c);
  } else {
    partialAdvance(c);
  }
}

function partialAdvance(c){
  const bracket = ageBracket(c.age);
  const pool = worldEventPool(ERAS[c.eraIndex].id, bracket);
  if(pool.length && Math.random() < 0.25){
    const ev = pick(pool);
    const deltas = applyEffectSpec(c, ev.e, null);
    if(ev.special) handleSpecial(c, ev.special);
    logEvent(c, fill(ev.t, c, null), eventClassFromDeltas(deltas));
  }
  c.actionUsage = {};
  renderGame();
}

function completeYear(c){
  if(c.job && c.age >= 18){
    applyJobRaise(c);
    c.money += c.salary;
  }
  if(c.secondJob && c.age >= 18){
    c.money += c.secondSalary;
    secondJobPenalty(c);
  }
  if(c.age > 60) c.stats.health = clamp(c.stats.health - randInt(1,4));
  applyPhysicalDecay(c);
  processEnrollment(c);
  applyEconomyInterest(c);
  processLoans(c);

  // relationship decay if neglected — mild, keeps the system meaningful
  c.relationships.filter(r=>r.active).forEach(r=>{ r.closeness = clamp(r.closeness - randInt(1,3)); });

  const bracket = ageBracket(c.age);

  // Branching mini-storyline roll — pauses year-end resolution until the
  // player chooses, and stands in for this year's normal world event (a
  // story IS the year's event, not an addition on top of it).
  if(STORY_BRACKETS.includes(bracket) && Math.random() < STORY_CHANCE){
    const storyPool = storiesFor(bracket, ERAS[c.eraIndex].id);
    if(storyPool.length){
      openStoryModal(c, pick(storyPool), () => finishYear(c));
      return;
    }
  }

  // Relationship reaction roll — same "stands in for the year's event" rule
  // as mini-stories above, just scoped to an actual named relationship
  // reacting to how things have been going, in their own voice.
  if(REACTION_BRACKETS.includes(bracket) && Math.random() < REACTION_CHANCE){
    const found = pickReactionForCharacter(c, bracket);
    if(found){
      openReactionModal(c, found.moment, found.rel, () => finishYear(c));
      return;
    }
  }

  runWorldEventAndLegendary(c, bracket);
  finishYear(c);
}

function runWorldEventAndLegendary(c, bracket){
  const pool = worldEventPool(ERAS[c.eraIndex].id, bracket);
  if(pool.length && Math.random() < 0.55){
    const ev = pick(pool);
    const deltas = applyEffectSpec(c, ev.e, null);
    if(ev.special) handleSpecial(c, ev.special);
    logEvent(c, fill(ev.t, c, null), eventClassFromDeltas(deltas));
  }

  // Rare legendary event roll — independent of the regular world-event roll,
  // so a memorable life beat can land even in an otherwise quiet year.
  if(LEGENDARY_BRACKETS.includes(bracket) && Math.random() < LEGENDARY_CHANCE){
    const legendaryPool = LEGENDARY_EVENTS[ERAS[c.eraIndex].id] || [];
    if(legendaryPool.length){
      const lev = pick(legendaryPool);
      applyEffectSpec(c, lev.e, null);
      logEvent(c, fill(lev.t, c, null), lev.cls, false, true);
    }
  }
}

function finishYear(c){
  applyMilestones(c);
  c.actionUsage = {};
  if(deathCheck(c)){ killCharacter(c); return; }
  cloudAutosave(); // one save per completed year — plenty often, not a network call per click
  renderGame();
}

function killCharacter(c){
  c.alive = false;
  const causes = c.stats.health<=0 ? ['a long illness','failing health','a fading heart'] : ['old age','a sudden accident','an unexpected turn'];
  c.causeOfDeath = pick(causes);
  checkAchievements(); // one final check against this life before it's recorded
  state.familyLog.push({
    gen:c.generation, name:c.name, era:ERAS[c.eraIndex].name, eraId:ERAS[c.eraIndex].id,
    age:c.age, money:c.money, savings:c.savings||0, debt:outstandingDebt(c), peakStat: topStat(c), causeOfDeath:c.causeOfDeath, highlight: topHighlightText(c),
  });
  trackEvent('life_ended', { bloodlineScore: computeBloodlineScore(), achievementsUnlocked: state.achievementsUnlocked || [] });
  cloudAutosave();
  renderDeath(c);
}
function topStat(c){ const e=Object.entries(c.stats); e.sort((a,b)=>b[1]-a[1]); return e[0][0]; }

// The single most shareable moment from a finished life — legendary events win,
// otherwise the first notable good/bad event. Used by the family tree view.
function topHighlightText(c){
  const legendaryEvent = c.events.find(e => e.legendary);
  if(legendaryEvent) return legendaryEvent.text;
  const notableEvent = c.events.find(e => e.cls === 'good' || e.cls === 'bad');
  return notableEvent ? notableEvent.text : null;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// Builds a plain-text, screenshot/paste-friendly summary of a finished life —
// designed to be the thing a player actually shares with a friend.
// Legendary moments are the most shareable, so they lead the highlight reel —
// shared by the text share, the image share, and the family tree's quote.
function topShareHighlights(c, n){
  const legendaryHighlights = c.events.filter(e => e.legendary).map(e => e.text);
  const otherHighlights = c.events.filter(e => !e.legendary && (e.cls === 'good' || e.cls === 'bad')).map(e => e.text);
  return legendaryHighlights.concat(otherHighlights).slice(0, n);
}

function generateShareText(c){
  const era = ERAS[c.eraIndex];
  const highlights = topShareHighlights(c, 3);
  const surname = c.surname || c.name.split(' ').slice(-1)[0];
  const totalEstate = (c.money||0) + (c.savings||0) - outstandingDebt(c);
  const challenge = state.activeChallenge ? CHALLENGES.find(ch=>ch.id===state.activeChallenge) : null;
  const lines = [];
  lines.push('🩸 BLOODLINE');
  if(challenge) lines.push(`🎯 Challenge: ${challenge.name}`);
  lines.push(`${c.name} — ${era.name} (${era.years})`);
  lines.push(`Age ${c.age} • ${c.job ? c.job : 'no steady job'} • Died of ${c.causeOfDeath}`);
  lines.push(`Left $${totalEstate.toLocaleString()} to the next generation`);
  if(highlights.length){
    lines.push('');
    lines.push('Life highlights:');
    highlights.forEach(h => lines.push(`• ${h}`));
  }
  lines.push('');
  lines.push(`Generation ${c.generation} of the ${surname} bloodline.`);
  if(challenge){
    lines.push(`Think you can beat this start? Same challenge → ${challengeShareUrl(challenge.id)}`);
  } else {
    lines.push('Play yours → https://bloodline-game.netlify.app');
  }
  return lines.join('\n');
}

/* ---------- downloadable share image (v2 of the share feature) ---------- */
function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(w=>{
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  });
  if(line) lines.push(line);
  return lines;
}
// Redraws the same avatar design as the SVG version, using canvas primitives
// (canvas can't render live SVG synchronously without an async image load),
// so the downloadable card matches what's shown in the game.
function drawAvatarOnCanvas(ctx, cx, cy, radius, c, theme){
  const grad = ctx.createRadialGradient(cx - radius*0.3, cy - radius*0.4, radius*0.1, cx, cy, radius);
  grad.addColorStop(0, theme.b);
  grad.addColorStop(1, theme.a);
  ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();

  const looks = (c.stats && c.stats.looks) || 50;
  if(looks >= 40){
    const lw = looks >= 80 ? 6 : looks >= 60 ? 4 : 2;
    ctx.lineWidth = lw; ctx.strokeStyle = '#f2c94c';
    ctx.beginPath(); ctx.arc(cx, cy, radius - lw/2, 0, Math.PI*2); ctx.stroke();
  }

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, radius - 2, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  const bracket = ageBracket(c.age);
  const P = AVATAR_PROPORTIONS[bracket];
  const scale = (radius*2)/100;
  const originX = cx - radius, originY = cy - radius;
  ctx.beginPath();
  ctx.ellipse(originX + 50*scale, originY + P.bodyCy*scale, P.bodyRx*scale, P.bodyRy*scale, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(originX + 50*scale, originY + P.headCy*scale, P.headR*scale, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function generateShareCanvas(c){
  const canvas = document.createElement('canvas');
  canvas.width = 900; canvas.height = 1200;
  const ctx = canvas.getContext('2d');
  const era = ERAS[c.eraIndex];
  const theme = ERA_THEME[era.id] || DEFAULT_THEME;

  const bgGrad = ctx.createLinearGradient(0,0,0,canvas.height);
  bgGrad.addColorStop(0, '#1c2130'); bgGrad.addColorStop(1, '#0f1119');
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,canvas.width,canvas.height);

  const topGrad = ctx.createLinearGradient(0,0,canvas.width,0);
  topGrad.addColorStop(0, theme.a); topGrad.addColorStop(1, theme.b);
  ctx.fillStyle = topGrad; ctx.fillRect(0,0,canvas.width,14);

  let y = 90;
  ctx.textAlign = 'center';
  ctx.fillStyle = theme.b;
  ctx.font = '700 32px "Segoe UI", Arial, sans-serif';
  ctx.fillText('🩸 BLOODLINE', canvas.width/2, y);

  y += 100;
  drawAvatarOnCanvas(ctx, canvas.width/2, y, 90, c, theme);

  y += 140;
  ctx.fillStyle = '#e9ebf2';
  ctx.font = '700 40px "Segoe UI", Arial, sans-serif';
  ctx.fillText(c.name, canvas.width/2, y);

  y += 42;
  ctx.fillStyle = '#9aa1b4';
  ctx.font = '400 22px "Segoe UI", Arial, sans-serif';
  ctx.fillText(`${era.name} (${era.years})`, canvas.width/2, y);

  y += 40;
  ctx.font = '400 22px "Segoe UI", Arial, sans-serif';
  ctx.fillText(`Age ${c.age} · ${c.job || 'no steady job'} · Died of ${c.causeOfDeath}`, canvas.width/2, y);

  y += 44;
  ctx.fillStyle = '#4fd18b';
  ctx.font = '700 26px "Segoe UI", Arial, sans-serif';
  const totalEstateImg = (c.money||0) + (c.savings||0);
  ctx.fillText(`Left $${totalEstateImg.toLocaleString()} to the next generation`, canvas.width/2, y);

  const highlights = topShareHighlights(c, 3);
  y += 60;
  if(highlights.length){
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e9ebf2';
    ctx.font = '700 22px "Segoe UI", Arial, sans-serif';
    ctx.fillText('Life highlights', 70, y);
    y += 34;
    ctx.font = '400 20px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#c7cbdb';
    highlights.forEach(h=>{
      const lines = wrapCanvasText(ctx, '• ' + h, canvas.width - 140);
      lines.forEach(line=>{ ctx.fillText(line, 70, y); y += 28; });
      y += 8;
    });
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9aa1b4';
  ctx.font = '400 20px "Segoe UI", Arial, sans-serif';
  const surname = c.surname || c.name.split(' ').slice(-1)[0];
  ctx.fillText(`Generation ${c.generation} of the ${surname} bloodline`, canvas.width/2, canvas.height - 70);
  ctx.fillStyle = theme.b;
  ctx.font = '700 22px "Segoe UI", Arial, sans-serif';
  ctx.fillText('Play yours → bloodline-game.netlify.app', canvas.width/2, canvas.height - 34);

  return canvas;
}
function downloadShareImage(c){
  const canvas = generateShareCanvas(c);
  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  const safeName = c.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  a.href = url; a.download = `bloodline-${safeName}-age${c.age}.png`;

/* ---------- family tree view ---------- */
// Distinct accent per era so the tree reads as a visual timeline, not a text list.
const ERA_COLORS = { wildwest:'#c98b5c', twenties:'#c98bff', postwar:'#4fd18b', modern:'#7c9eff', future:'#4cd7f2' };
function eraIdFromName(name){ const found = ERAS.find(e=>e.name===name); return found ? found.id : ERAS[0].id; }

/* ---------- per-era visual theming ---------- */
// Each era gets its own two-color accent gradient, applied as CSS custom
// properties, so the header/buttons/highlights subtly shift with the setting
// instead of every era looking identical.
const ERA_THEME = {
  wildwest:{ a:'#c98b5c', b:'#e0b48c', glow:'#3a2c1f' },
  twenties:{ a:'#c98bff', b:'#7c9eff', glow:'#241f3a' },
  postwar:{ a:'#4fd18b', b:'#7ee8ac', glow:'#1a2e22' },
  modern:{ a:'#7c9eff', b:'#c98bff', glow:'#232a3d' },
  future:{ a:'#4cd7f2', b:'#7c9eff', glow:'#152a33' },
};
const DEFAULT_THEME = { a:'#7c9eff', b:'#c98bff', glow:'#232a3d' };
function applyEraTheme(eraId){
  const t = ERA_THEME[eraId] || DEFAULT_THEME;
  document.documentElement.style.setProperty('--accent', t.a);
  document.documentElement.style.setProperty('--accent-2', t.b);
  document.documentElement.style.setProperty('--bg-glow', t.glow || DEFAULT_THEME.glow);
}
function resetTheme(){
  document.documentElement.style.setProperty('--accent', DEFAULT_THEME.a);
  document.documentElement.style.setProperty('--accent-2', DEFAULT_THEME.b);
  document.documentElement.style.setProperty('--bg-glow', DEFAULT_THEME.glow);
}

/* ---------- character avatar ---------- */
// Deliberately abstract, not a literal illustration: an era-tinted medallion
// with a neutral silhouette bust that resizes by age bracket, plus a gold
// ring that appears as the Looks stat climbs. Makes the character read as
// someone rather than just a stat sheet, without attempting real portraiture.
let avatarIdCounter = 0;
const AVATAR_PROPORTIONS = {
  infant:{ headR:24, headCy:46, bodyRy:22, bodyCy:88, bodyRx:26 },
  toddler:{ headR:21, headCy:42, bodyRy:24, bodyCy:90, bodyRx:28 },
  kid:{ headR:18, headCy:38, bodyRy:26, bodyCy:92, bodyRx:30 },
  teen:{ headR:16, headCy:35, bodyRy:28, bodyCy:94, bodyRx:32 },
  adult:{ headR:15, headCy:34, bodyRy:29, bodyCy:95, bodyRx:33 },
  senior:{ headR:15, headCy:36, bodyRy:27, bodyCy:94, bodyRx:31 },
};
function avatarSVG(c, size){
  size = size || 64;
  const uid = 'av' + (avatarIdCounter++);
  const bracket = ageBracket(c.age);
  const eraId = c.eraId || ERAS[c.eraIndex].id;
  const theme = ERA_THEME[eraId] || DEFAULT_THEME;
  const looks = (c.stats && c.stats.looks) || 50;
  const P = AVATAR_PROPORTIONS[bracket];
  const ringWidth = looks >= 80 ? 4 : looks >= 60 ? 2.5 : looks >= 40 ? 1 : 0;
  const ringColor = looks >= 40 ? '#f2c94c' : 'transparent';
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" class="avatar-svg">
      <defs>
        <radialGradient id="${uid}g" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="${theme.b}"/>
          <stop offset="100%" stop-color="${theme.a}"/>
        </radialGradient>
        <clipPath id="${uid}c"><circle cx="50" cy="50" r="46"/></clipPath>
      </defs>
      <circle cx="50" cy="50" r="48" fill="url(#${uid}g)" stroke="${ringColor}" stroke-width="${ringWidth}"/>
      <g clip-path="url(#${uid}c)">
        <ellipse cx="50" cy="${P.bodyCy}" rx="${P.bodyRx}" ry="${P.bodyRy}" fill="rgba(255,255,255,0.92)"/>
        <circle cx="50" cy="${P.headCy}" r="${P.headR}" fill="rgba(255,255,255,0.92)"/>
        ${bracket==='senior' ? `<circle cx="50" cy="${P.headCy}" r="${P.headR+4}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>` : ''}
      </g>
    </svg>`;
}

function treeSurname(){
  if(state.char && state.char.surname) return state.char.surname;
  if(state.familyLog.length){
    const last = state.familyLog[state.familyLog.length-1];
    return last.name.split(' ').slice(-1)[0];
  }
  return '';
}

// The chain is linear (one child inherits at a time), not branching — but it's
// still the family's whole story, oldest ancestor first, current life last.
function buildTreeChain(){
  const chain = state.familyLog.map(f => ({ ...f, alive:false }));
  // Only append state.char separately while they're still alive — once they've
  // died, killCharacter() has already recorded them in familyLog, so adding
  // them again here would show the same life twice.
  if(state.char && state.char.alive){
    chain.push({
      gen: state.char.generation, name: state.char.name, era: ERAS[state.char.eraIndex].name,
      eraId: ERAS[state.char.eraIndex].id, age: state.char.age, money: state.char.money, savings: state.char.savings||0,
      peakStat: topStat(state.char), causeOfDeath: null,
      highlight: topHighlightText(state.char), alive: true,
    });
  }
  return chain;
}

const TRAIT_LABEL = {health:'Health',happiness:'Happiness',smarts:'Smarts',looks:'Looks',strength:'Strength',agility:'Agility'};

function treeNodeHtml(f){
  const eraId = f.eraId || eraIdFromName(f.era);
  const color = ERA_COLORS[eraId] || 'var(--accent)';
  const traitLabel = TRAIT_LABEL[f.peakStat] || f.peakStat;
  const totalLeft = (f.money||0) + (f.savings||0) - (f.debt||0);
  const detailLine = f.alive
    ? `Age ${f.age} · still writing their story`
    : `Lived to ${f.age} · died of ${f.causeOfDeath || 'unknown causes'} · left $${totalLeft.toLocaleString()}`;
  const traitChip = traitLabel ? `<span class="tn-trait">Defining trait: ${traitLabel}</span>` : '';
  const highlightLine = f.highlight ? `<div class="tn-detail tn-quote">"${escapeHtml(f.highlight)}"</div>` : '';
  return `
    <div class="tree-node${f.alive ? ' current' : ''}" style="--node-color:${color};">
      <div class="tn-top">
        <span class="tn-name-row">${avatarSVG(f, 34)}<span class="tn-name">${escapeHtml(f.name)}</span></span>
        <span class="tn-gen">Gen ${f.gen}</span>
      </div>
      <div class="tn-era">${escapeHtml(f.era)}${f.alive ? ' · currently living' : ''}</div>
      <div class="tn-detail">${detailLine}</div>
      ${traitChip}
      ${highlightLine}
    </div>`;
}

function openFamilyTree(){
  const overlay = document.getElementById('tree-overlay');
  const chain = buildTreeChain();
  const surname = treeSurname();
  overlay.innerHTML = `
    <div class="tree-panel">
      <button class="tree-close" id="tree-close-btn" aria-label="Close">✕</button>
      <h2 style="margin-top:0;">Family Tree</h2>
      <div class="tree-sub">${chain.length} generation${chain.length===1?'':'s'}${surname ? ` of the ${escapeHtml(surname)} bloodline` : ''} · Bloodline Score: ${computeBloodlineScore().toLocaleString()}</div>
      ${chain.length ? `<div class="tree-chain">${chain.map(treeNodeHtml).join('')}</div>` : '<div class="tree-empty">No ancestors yet — you\'re the first.</div>'}
    </div>`;
  overlay.style.display = 'flex';
  document.getElementById('tree-close-btn').onclick = closeFamilyTree;
  overlay.onclick = (e)=>{ if(e.target === overlay) closeFamilyTree(); };

function closeFamilyTree(){

  overlay.style.display = 'none';
  overlay.innerHTML = '';
}

function startChallenge(challenge){

function statBar(label, key, value){
  return `<div class="stat-row stat-${key}"><div class="stat-label"><span>${label}</span><span>${value}</span></div>

const ROLE_LABEL = {mother:'Mother',father:'Father',sibling:'Sibling',pet:'Pet',bestfriend:'Best Friend',friend:'Friend',partner:'Partner',teacher:'Teacher',boss:'Boss',coworker:'Coworker'};

const JOB_TIER_LABEL = { fallback:'Fallback', standard:'Standard', desirable:'Desirable' };
// The career board — every job in the character's era, locked or not, with
// its requirements spelled out. This is the "locked jobs are visible, not
// hidden" decision: a goal-post to build toward instead of a surprise
// unlock. Shown on the Finances tab.
function careerBoardHtml(c){
  const era = ERAS[c.eraIndex];
  const pool = JOBS[era.id];
  if(!pool) return '';
  const isTeen = c.age < 18;
  const tiers = isTeen ? [['teen', pool.teen||[]]] : [['desirable',pool.desirable||[]],['standard',pool.standard||[]],['fallback',pool.fallback||[]]];
  const rows = tiers.map(([tierKey, jobs])=>{
    const jobRows = jobs.map(j=>{
      const qualifies = meetsPrereq(c, j.prereq);
      const isCurrent = c.job === j.title;
      const icon = isCurrent ? '💼' : (qualifies ? '✅' : '🔒');
      const cls = isCurrent ? 'job-row current' : (qualifies ? 'job-row' : 'job-row locked');
      return `<div class="${cls}"><span>${icon} ${escapeHtml(j.title)}</span><span class="job-req">${escapeHtml(prereqText(j.prereq))}</span></div>`;
    }).join('');
    const tierLabel = isTeen ? 'Teen jobs' : JOB_TIER_LABEL[tierKey];
    return `<div class="job-tier"><h5>${tierLabel}</h5>${jobRows}</div>`;
  }).join('');

  const degreeOpts = (DEGREE_TYPES[era.id]||[]);
  const enrolledHtml = c.enrolled
    ? (()=>{ const d = degreeById(c.enrolled.id); return `<div class="training-status">📚 Currently pursuing: <strong>${escapeHtml(d.label)}</strong> — ${c.enrolled.yearsLeft} year${c.enrolled.yearsLeft===1?'':'s'} left</div>`; })()
    : '';
  const degreeRows = degreeOpts.map(d=>{
    const have = hasDegree(c, d.id);
    const cooldown = degreeOnCooldown(c, d.id);
    const status = have ? '✅ Completed' : (cooldown ? `⏳ Available again at age ${c.degreeCooldowns[d.id]}` : `$${d.cost}, ${d.years} yr`);
    return `<div class="job-row"><span>${escapeHtml(d.label)}</span><span class="job-req">${status}</span></div>`;
  }).join('');

  return `<div class="career-section"><h4>Career Board — ${era.name}</h4>${enrolledHtml}${rows}
    <div class="job-tier"><h5>Training &amp; Degrees</h5>${degreeRows}</div>
  </div>`;
}

// Tabs split what used to be one long scroll into focused views. The vitals
// (avatar/stats/money/skills) stay always-visible on the left since you want
// those no matter what you're browsing; only the deeper per-domain content
// and the matching action categories are tabbed.
const TAB_CATEGORY_MAP = {
  life:['School','Work','Activities','Play','Health','Growth','Risk','Hobbies'],
  relationships:['Family','Social'],
  finances:['Money','Shop'],
};
const TABS = [
  { id:'life', label:'Life' },
  { id:'relationships', label:'Relationships' },
  { id:'finances', label:'Finances' },
  { id:'family', label:'Family' },
];
let activeTab = 'life';

function renderGame(){
  setupEl.style.display='none'; deathEl.style.display='none'; gameEl.style.display='block';
  const c = state.char;
  const era = ERAS[c.eraIndex];
  applyEraTheme(era.id);
  checkAchievements().forEach(a => logEvent(c, `🏆 Achievement unlocked: ${a.label}!`, 'good'));
  const bracket = ageBracket(c.age);
  const allActions = buildActionMenu(c);
  const tabActions = activeTab === 'family' ? [] : allActions.filter(a => (TAB_CATEGORY_MAP[activeTab]||[]).includes(a.category));

  const byCat = {};
  tabActions.forEach(a=>{ (byCat[a.category] = byCat[a.category]||[]).push(a); });

  const relHtml = c.relationships.filter(r=>r.active).map(r=>`
    <div class="rel-item">
      <div class="rel-name"><span>${displayName(r)}</span><span class="role">${(r.role === 'partner' && r.married) ? 'Spouse' : (ROLE_LABEL[r.role]||r.role)}</span></div>
      <div class="rel-bar"><div class="rel-fill" style="width:${r.closeness}%;"></div></div>
    </div>`).join('');

  const ownedHtml = c.owned.length
    ? c.owned.map(id=>{ const item=(SHOP_ITEMS[era.id]||[]).find(i=>i.id===id); return `<div>${item?item.label:id}</div>`; }).join('')
    : '<div>Nothing yet.</div>';

  const creditHtml = c.creditScore == null ? '' : `
    <div class="credit-section">
      <h4>${CREDIT_LABEL[era.id]}</h4>
      <div>${c.creditScore} <span style="color:var(--text-dim);font-size:0.8rem;">(${creditTierLabel(c.creditScore)})</span></div>
      ${ (c.loans && c.loans.length) ? `<div class="loans-list">${c.loans.map(l=>`<div>${escapeHtml(l.itemLabel)}: $${l.balance.toLocaleString()} left · $${l.payment.toLocaleString()}/yr</div>`).join('')}</div>` : '<div style="color:var(--text-dim);font-size:0.8rem;">No active loans.</div>' }
    </div>`;

  const tabPanelHtml = {
    life: '',
    relationships: `<div class="rel-section">${relHtml || '<div style="font-size:0.8rem;color:var(--text-dim);">No relationships yet.</div>'}</div>`,
    finances: `<div class="owned-section"><h4>Owned</h4><div class="owned-list">${ownedHtml}</div></div>${creditHtml}${careerBoardHtml(c)}`,
    family: `<div class="legacy-box"><h4>Family Legacy — Gen ${state.generation}</h4>
      ${ state.familyLog.length === 0 ? '<div>No ancestors yet — you\'re the first.</div>'
         : state.familyLog.map(f=>`<div>Gen ${f.gen}: <strong>${f.name}</strong> (${f.era}) — lived to ${f.age}, left $${((f.money||0)+(f.savings||0)-(f.debt||0)).toLocaleString()}</div>`).join('') }

function renderDeath(c){
  gameEl.style.display='none'; setupEl.style.display='none'; deathEl.style.display='block';
  const era = ERAS[c.eraIndex];
  applyEraTheme(era.id);
  const nextEraIndex = Math.min(c.eraIndex + 1, ERAS.length - 1);
  const nextEra = ERAS[nextEraIndex];
  const hasNextEra = c.eraIndex < ERAS.length - 1;
  // Estate = cash + savings. The old version only passed on c.money, so any
  // savings a player carefully built up simply vanished at death instead of
  // reaching their heir — this fixes that.
  const totalEstate = (c.money||0) + (c.savings||0) - outstandingDebt(c);
  const inheritance = Math.round(totalEstate * 0.4);
  const bonusStat = topStat(c);
  const STAT_LABEL_MAP = {health:'Health',happiness:'Happiness',smarts:'Smarts',looks:'Looks',imagination:'Imagination',strength:'Strength',agility:'Agility'};
  const statLabel = STAT_LABEL_MAP[bonusStat];
  const shareText = generateShareText(c);
  const activeChallengeObj = state.activeChallenge ? CHALLENGES.find(ch=>ch.id===state.activeChallenge) : null;

  // Two candidate children to choose from at the handoff — real branching, so
  // two people playing "the same" bloodline can end up with different stories.
  const STAT_KEYS = ['health','happiness','smarts','looks','imagination','strength','agility'];
  function pickDifferentStat(exclude){ let s; let guard=0; do{ s = pick(STAT_KEYS); guard++; } while(s===exclude && guard<10); return s; }
  const childSurname = c.surname || c.name.split(' ').slice(-1)[0];
  const child1Name = firstNameForEra(nextEra.id);
  let child2Name = firstNameForEra(nextEra.id);
  if(child2Name === child1Name) child2Name = firstNameForEra(nextEra.id);
  const child1Stat = bonusStat;
  const child2Stat = pickDifferentStat(child1Stat);

  deathEl.innerHTML = `
    <div class="death-panel">
      <h2>${c.name} has died</h2>
      <div class="epitaph">Age ${c.age} · ${era.name} · cause: ${c.causeOfDeath}</div>
      ${activeChallengeObj ? `<div class="challenge-tag">🎯 Challenge: ${escapeHtml(activeChallengeObj.name)}</div>` : ''}
      <div id="stats-teaser" class="stats-teaser" style="display:none;"></div>
      <div class="stat-summary">
        <div><div class="val">${c.age}</div><div class="lbl">Years Lived</div></div>
        <div><div class="val">$${totalEstate.toLocaleString()}</div><div class="lbl">Estate</div></div>
        <div><div class="val">${statLabel}</div><div class="lbl">Defining Trait</div></div>
        <div><div class="val">${computeBloodlineScore().toLocaleString()}</div><div class="lbl">Bloodline Score</div></div>
      </div>
      <p style="color:var(--text-dim);font-size:0.9rem;max-width:480px;margin:0 auto 10px;">
        Two children carry on the ${escapeHtml(childSurname)} bloodline. Each inherits <strong>$${inheritance.toLocaleString()}</strong>${hasNextEra ? `, growing up in <strong>${nextEra.name}</strong> (${nextEra.years})` : ', continuing the family story here'} — pick who to play next.
      </p>

      <div class="share-box">
        <h4>Share this life</h4>
        <textarea id="share-text" readonly>${escapeHtml(shareText)}</textarea>
        <div class="btn-row" style="justify-content:center;margin-top:10px;">
          <button class="btn-secondary" id="copy-share-btn">Copy to Clipboard</button>
          <button class="btn-secondary" id="download-image-btn">Download Image</button>
          ${activeChallengeObj ? '<button class="btn-secondary" id="copy-challenge-link-btn">Copy Challenge Link</button>' : ''}
        </div>
      </div>

      <div class="btn-row" style="justify-content:center;">
        <button class="btn-primary" id="continue-btn-1">Continue as ${escapeHtml(child1Name)} (strong ${STAT_LABEL_MAP[child1Stat]}) →</button>
        <button class="btn-primary" id="continue-btn-2">Continue as ${escapeHtml(child2Name)} (strong ${STAT_LABEL_MAP[child2Stat]}) →</button>
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn-secondary" id="view-tree-btn-death">🌳 View Family Tree</button>
        <button class="btn-secondary" id="view-achievements-btn-death">🏆 Achievements</button>
        <button class="btn-secondary" id="new-life-btn">Start a New Bloodline</button>
        <button class="btn-secondary" id="load-save-btn-death">Load a Save…</button>
        <button class="btn-secondary" id="feedback-btn-death">💬 Feedback</button>
        <button class="btn-secondary" id="faq-btn-death">❓ Help &amp; FAQ</button>
      </div>
    </div>`;

  function continueAs(childName, childStat){
    state.generation += 1;
    const fullName = `${childName} ${childSurname}`;
    state.char = newCharacter(nextEraIndex, fullName, {money: inheritance, bonusStat: childStat});
    state.activeChallenge = null; // a challenge seed applies to the one life it started, not the heir
    trackEvent('life_started', { era: ERAS[nextEraIndex].id });
    renderGame();
    cloudAutosave();
  }
  document.getElementById('continue-btn-1').onclick = ()=> continueAs(child1Name, child1Stat);
  document.getElementById('continue-btn-2').onclick = ()=> continueAs(child2Name, child2Stat);
  document.getElementById('view-tree-btn-death').onclick = openFamilyTree;
  document.getElementById('view-achievements-btn-death').onclick = openAchievements;
  document.getElementById('new-life-btn').onclick = ()=>{
    // Wipes the whole family history (tree, achievements, Bloodline Score) —
    // confirm first, since there's no autosave to fall back on.
    if(!confirm('Start a brand new bloodline? This clears your current family history and achievements unless you saved first.')) return;
    state = {generation:1, familyLog:[], char:null, activeChallenge:null};
    selectedEra = 0;
    renderSetup();
  };
  document.getElementById('load-save-btn-death').onclick = ()=>{
    if(confirm('Loading a save will replace your current bloodline history. Continue?')) triggerLoad();
  };
  document.getElementById('feedback-btn-death').onclick = openFeedbackModal;
  document.getElementById('faq-btn-death').onclick = openFaqModal;
  document.getElementById('download-image-btn').onclick = ()=>{
    const btn = document.getElementById('download-image-btn');
    try{
      downloadShareImage(c);
      btn.textContent = 'Downloaded!';
    } catch(e){
      btn.textContent = 'Could not generate image';
    }
    setTimeout(()=>{ btn.textContent = 'Download Image'; }, 1800);
  };
  document.getElementById('copy-share-btn').onclick = async ()=>{
    const btn = document.getElementById('copy-share-btn');
    const resetLabel = ()=> setTimeout(()=>{ btn.textContent = 'Copy to Clipboard'; }, 1800);
    try{
      await navigator.clipboard.writeText(shareText);
      btn.textContent = 'Copied!';
    } catch(e){
      try{
        const ta = document.getElementById('share-text');
        ta.focus(); ta.select();
        document.execCommand('copy');
        btn.textContent = 'Copied!';
      } catch(e2){
        btn.textContent = 'Select the text above to copy';
      }
    }
    resetLabel();
  };
  const copyChallengeBtn = document.getElementById('copy-challenge-link-btn');
  if(copyChallengeBtn && activeChallengeObj){
    copyChallengeBtn.onclick = async ()=>{
      const link = challengeShareUrl(activeChallengeObj.id);
      const resetLabel = ()=> setTimeout(()=>{ copyChallengeBtn.textContent = 'Copy Challenge Link'; }, 1800);
      try{
        await navigator.clipboard.writeText(link);
        copyChallengeBtn.textContent = 'Copied!';
      } catch(e){
        copyChallengeBtn.textContent = link;
      }
      resetLabel();
    };
  }
  loadStatsTeaser(c);
}

/* ---------- player-facing stats teaser (death screen) ----------
   Pulls from the public, non-admin stats endpoint (no ADMIN_KEY needed) and
   surfaces one relevant number — degrades silently (stays hidden) if the
   backend isn't deployed yet or the fetch fails, same pattern as the rest
   of the optional cloud features. */
async function loadStatsTeaser(c){
  const el = document.getElementById('stats-teaser');
  if(!el) return;
  const res = await cloudGet('public-stats');
  if(!res || !res.totalDeaths || !res.achievements){ return; }
  const earnedIds = state.achievementsUnlocked || [];
  const earnedThisRun = earnedIds.map(id => res.achievements[id]).filter(Boolean);
  let text = '';
  if(earnedThisRun.length){
    const rarest = earnedThisRun.reduce((a,b)=> (a.pct <= b.pct ? a : b));
    text = `📊 Only ${rarest.pct}% of players have earned "${rarest.label}" — you just did.`;
  } else {
    const fallback = res.achievements['millionaire'];
    if(fallback) text = `📊 Only ${fallback.pct}% of players have ever earned "${fallback.label}."`;
  }
  if(text){ el.textContent = text; el.style.display = 'block'; }
}

/* ---------- cloud (optional): identity, autosave, play stats, feedback ----------
   Everything here degrades to a silent no-op if the backend isn't deployed
   yet (fetch fails -> caught -> null) or if the player chooses to skip it —
   the game is fully playable offline either way, this is purely additive. */
const CLOUD = { playerId: null, authType: null };
const GOOGLE_CLIENT_ID = (document.querySelector('meta[name="google-signin-client-id"]') || {}).content?.trim() || '';

async function cloudPost(path, body){
  try{
    const res = await fetch(`/.netlify/functions/${path}`, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body||{}) });
    if(!res.ok) return null;
    return await res.json();
  } catch(e){ return null; }
}
async function cloudGet(path){
  try{
    const res = await fetch(`/.netlify/functions/${path}`);
    if(!res.ok) return null;
    return await res.json();
  } catch(e){ return null; }
}

function cloudStatusText(){
  if(!CLOUD.playerId) return '';
  return CLOUD.authType === 'google' ? '☁️ Signed in · auto-saving' : '☁️ Guest · auto-saving (this device)';
}

function trackEvent(event, data){
  if(!CLOUD.playerId) return;
  cloudPost('track', { playerId: CLOUD.playerId, event, data });
}

let autosaveTimer = null;
function cloudAutosave(){
  if(!CLOUD.playerId || !state.char) return;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=>{
    cloudPost('save', { playerId: CLOUD.playerId, state: { format:'bloodline-save', version:1, state } });
  }, 300);
}

function ensureIdentity(callback){
  if(CLOUD.playerId || localStorage.getItem('bloodline_cloud_skipped')){ callback(); return; }
  showIdentityModal(callback);
}

function finishIdentity(res, overlay, onDone){
  overlay.style.display = 'none';
  if(res && res.playerId){
    CLOUD.playerId = res.playerId;
    CLOUD.authType = res.authType;
    localStorage.setItem('bloodline_playerId', res.playerId);
    localStorage.setItem('bloodline_authType', res.authType);
    localStorage.removeItem('bloodline_cloud_skipped');
    trackEvent('session_start');
  }
  if(onDone) onDone();
}

function showIdentityModal(onDone){
  const overlay = document.getElementById('cloud-overlay');
  overlay.innerHTML = `
    <div class="tree-panel" style="max-width:440px;">
      <h2 style="margin-top:0;">Save your progress?</h2>

        <button class="btn-secondary id-choice-btn" id="id-guest-btn">

          <div class="sub-desc">No sign-in. Auto-saves right here in this browser only — clearing your browser data or switching devices loses it.</div>
        </button>
        <div>
          <div id="google-btn-holder"></div>
          <div class="sub-desc" style="margin-top:6px;">${GOOGLE_CLIENT_ID ? 'Sign in with Google — auto-saves to your account so your bloodline follows you to any device.' : ''}</div>
        </div>
      </div>
      <button class="id-skip-btn" id="id-skip-btn">Skip — I'll just use manual Save/Load files</button>

function closeFeedbackModal(){ document.getElementById('feedback-overlay').style.display = 'none'; }

// On load: if this browser already has an identity, quietly resume it (no
// modal) and check for a cloud save so the setup screen can offer to
// continue it. If fetches fail (backend not deployed, offline, etc.) this
// just leaves the game exactly as it's always worked — local-only.
async function initCloud(){
  const storedId = localStorage.getItem('bloodline_playerId');
  const storedAuth = localStorage.getItem('bloodline_authType');
  if(!storedId) return;
  CLOUD.playerId = storedId;
  CLOUD.authType = storedAuth;
  trackEvent('session_start');
  cloudPost('identify', { existingPlayerId: storedId });
  const res = await cloudGet(`save?playerId=${encodeURIComponent(storedId)}`);
  if(res && res.state && res.state.state && res.state.state.char){
    window.__cloudSaveAvailable = res.state;
    if(!state.char) renderSetup(); // refresh the setup screen with the "Continue" option now that we know
  }
}

/* ---------- save / load ---------- */
function downloadJSON(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function saveGame(){
  if(!state.char) return;
  const payload = { format:'bloodline-save', version:1, state };
  const safeName = state.char.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  downloadJSON(`bloodline-save-${safeName}-age${state.char.age}.json`, payload);
}

function triggerLoad(){ document.getElementById('load-input').click(); }

// Shared by both manual file loads and cloud "Continue Your Saved Game" —
// same validation, same restore path, one place to keep them in sync.
function loadStatePayload(payload){
  if(!payload || payload.format !== 'bloodline-save' || !payload.state || !payload.state.char){
    alert("That doesn't look like a valid Bloodline save.");
    return false;
  }
  state = payload.state;
  // keep future relationship ids from colliding with anything in the loaded save
  let maxId = 0;
  (state.char.relationships || []).forEach(r=>{
    const m = /^r(\d+)$/.exec(r.id||'');
    if(m) maxId = Math.max(maxId, parseInt(m[1],10));
  });
  relCounter = maxId + 1;
  if(state.char.alive){ renderGame(); } else { renderDeath(state.char); }
  return true;
}

function handleLoadFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const payload = JSON.parse(reader.result);
      if(!loadStatePayload(payload)) throw new Error('invalid');
    } catch(e){
      alert("That doesn't look like a valid Bloodline save file.");
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

document.getElementById('load-input').addEventListener('change', handleLoadFile);
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape'){ closeFamilyTree(); closeFeedbackModal(); } });

checkChallengeLink();
initCloud();
renderSetup();
</script>
</body>
</html>
