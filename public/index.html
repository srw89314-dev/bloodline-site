<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloodline — A Multi-Era Life Sim</title>
<!-- Optional cloud save / sign-in. Leave the content blank to keep the game
     fully offline (Guest mode still works with no client ID at all) — paste
     your Google OAuth Web Client ID here once you've created one to turn on
     "Sign in with Google" in the save-choice modal. See design-notes.md. -->
<meta name="google-signin-client-id" content="">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#12141c; --panel:#1a1e2a; --border:#2b3142;
    --text:#e9ebf2; --text-dim:#9aa1b4;
    --accent:#7c9eff; --accent-2:#c98bff;
    --good:#4fd18b; --warn:#f2c94c; --bad:#f2685c; --money:#4fd18b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, var(--bg-glow, #232a3d) 0%, var(--bg) 60%);
    transition:background .4s ease;
    color:var(--text); display:flex; justify-content:center; padding:24px 16px 60px;
  }
  #app{ width:100%; max-width:1040px; }
  header.top{ text-align:center; margin-bottom:20px; }
  header.top h1{
    font-size:1.8rem; margin:0 0 4px; letter-spacing:0.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header.top p{ margin:0; color:var(--text-dim); font-size:0.9rem; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:16px; }

  /* setup */
  .era-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:16px 0; }
  .era-option{ border:2px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; transition:border-color .15s, transform .15s; background:#161a26; }
  .era-option:hover{ transform:translateY(-2px); }
  .era-option.selected{ border-color:var(--accent); background:#1c2338; }
  .era-option h3{ margin:0 0 4px; font-size:1rem; }
  .era-option span{ color:var(--text-dim); font-size:0.8rem; }
  label{ display:block; font-size:0.85rem; color:var(--text-dim); margin:14px 0 6px; }
  input[type=text]{ width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:#0f1119; color:var(--text); font-size:1rem; }
  input[type=text]:focus{ outline:none; border-color:var(--accent); }
  button{ font-family:inherit; font-size:0.9rem; font-weight:600; border:none; border-radius:10px; padding:10px 16px; cursor:pointer; transition:filter .15s, transform .1s; }
  button:active{ transform:scale(0.98); }
  button:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-primary{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#0f1119; }
  .btn-primary:hover:not(:disabled){ filter:brightness(1.08); }
  .btn-secondary{ background:#262c3d; color:var(--text); border:1px solid var(--border); }
  .btn-secondary:hover:not(:disabled){ filter:brightness(1.15); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }

  /* game */
  .game-layout{ display:grid; grid-template-columns:280px 1fr; gap:16px; }
  @media (max-width:760px){ .game-layout{ grid-template-columns:1fr; } }
  .char-header{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .avatar-svg{ flex-shrink:0; border-radius:50%; }
  .char-header h2{ margin:0; font-size:1.2rem; }
  .char-header .meta{ color:var(--text-dim); font-size:0.82rem; }
  .stat-row{ margin-bottom:10px; }
  .stat-label{ display:flex; justify-content:space-between; font-size:0.78rem; color:var(--text-dim); margin-bottom:4px; }
  .stat-bar{ height:8px; border-radius:6px; background:#0f1119; overflow:hidden; border:1px solid var(--border); }
  .stat-fill{ height:100%; border-radius:6px; transition:width .3s ease; }
  .stat-health .stat-fill{ background:var(--bad); }
  .stat-happiness .stat-fill{ background:var(--warn); }
  .stat-smarts .stat-fill{ background:var(--accent); }
  .stat-looks .stat-fill{ background:var(--accent-2); }
  .stat-imagination .stat-fill{ background:#e0a4f2; }
  .money-line{ display:flex; justify-content:space-between; align-items:center; background:#0f1119; border:1px solid var(--border); border-radius:10px; padding:9px 12px; margin-top:12px; font-weight:600; font-size:0.9rem; }
  .money-line .amt{ color:var(--money); }
  .job-line{ font-size:0.78rem; color:var(--text-dim); margin-top:6px; }

  .rel-section h4, .owned-section h4, .legacy-box h4{ margin:14px 0 8px; color:var(--text); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); }
  .rel-item{ margin-bottom:8px; }
  .rel-name{ display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:3px; }
  .rel-name .role{ color:var(--text-dim); font-weight:400; }
  .rel-bar{ height:6px; border-radius:4px; background:#0f1119; overflow:hidden; border:1px solid var(--border); }
  .rel-fill{ height:100%; border-radius:4px; background:var(--accent-2); }
  .owned-list{ font-size:0.78rem; color:var(--text-dim); line-height:1.6; }
  .skills-box{ font-size:0.78rem; color:var(--text-dim); line-height:1.7; }
  .skills-box strong{ color:var(--text); }
  .legacy-box{ font-size:0.76rem; color:var(--text-dim); max-height:140px; overflow-y:auto; }
  .legacy-box div{ margin-bottom:6px; line-height:1.4; }
  .divider{ border-top:1px solid var(--border); margin-top:14px; padding-top:2px; }

  .tab-bar{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tab-btn{ background:#161a26; border:1px solid var(--border); color:var(--text-dim); padding:8px 14px; border-radius:9px; font-size:0.82rem; font-weight:600; }
  .tab-btn:hover{ border-color:var(--accent); color:var(--text); }
  .tab-btn.active{ background:var(--accent); color:#0f1119; border-color:var(--accent); }
  #tab-panel{ margin-bottom:16px; }
  #tab-panel:empty{ margin-bottom:0; }

  .actions-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .actions-header h3{ margin:0; font-size:1rem; }
  .actions-left{ font-size:0.8rem; color:var(--text-dim); }
  .action-cat{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-dim); margin:14px 0 6px; }
  .action-cat:first-of-type{ margin-top:0; }
  .action-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; }
  .action-btn{ text-align:left; background:#161a26; border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:9px; font-size:0.84rem; font-weight:500; }
  .action-btn:hover:not(:disabled){ border-color:var(--accent); background:#1c2338; }
  .action-btn .sub{ display:block; color:var(--text-dim); font-weight:400; font-size:0.74rem; margin-top:2px; }

  .end-year-row{ margin-top:16px; display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }

  .event-feed{ max-height:280px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px; margin-top:16px; }
  .event{ background:#161a26; border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:8px; padding:9px 12px; font-size:0.85rem; line-height:1.4; }
  .event.good{ border-left-color:var(--good); }
  .event.bad{ border-left-color:var(--bad); }
  .event.milestone{ border-left-color:var(--accent-2); font-weight:600; }
  .event.legendary{ border-left-color:var(--warn); font-weight:600; background:#1f1a10; }

  /* family tree */
  .tree-overlay{ position:fixed; inset:0; background:rgba(8,9,14,0.82); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:40px 16px; overflow-y:auto; }
  .tree-panel{ background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:26px; max-width:560px; width:100%; position:relative; }
  .tree-panel h2{ margin:0 0 4px; }
  .tree-sub{ color:var(--text-dim); font-size:0.85rem; margin-bottom:22px; }
  .tree-close{ position:absolute; top:16px; right:16px; background:#262c3d; border:1px solid var(--border); color:var(--text); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:1rem; line-height:1; }
  .tree-chain{ position:relative; padding-left:26px; }
  .tree-chain::before{ content:''; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--border); }
  .tree-node{ position:relative; margin-bottom:16px; padding:14px 16px; background:#161a26; border:1px solid var(--border); border-radius:10px; }
  .tree-node:last-child{ margin-bottom:0; }
  .tree-node::before{ content:''; position:absolute; left:-26px; top:19px; width:12px; height:12px; border-radius:50%; background:var(--node-color, var(--accent)); border:2px solid var(--panel); box-shadow:0 0 0 2px var(--node-color, var(--accent)); }
  .tree-node.current{ border-color:var(--node-color, var(--accent)); background:#1c2338; }
  .tree-node .tn-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:2px; }
  .tree-node .tn-name-row{ display:flex; align-items:center; gap:8px; }
  .tree-node .tn-name{ font-size:1rem; font-weight:700; }
  .tree-node .tn-gen{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); white-space:nowrap; }
  .tree-node .tn-era{ font-size:0.76rem; color:var(--node-color, var(--accent)); font-weight:600; margin-bottom:6px; }
  .tree-node .tn-detail{ font-size:0.8rem; color:var(--text-dim); line-height:1.5; }
  .tree-node .tn-quote{ margin-top:6px; font-style:italic; }
  .tree-node .tn-trait{ display:inline-block; margin-top:8px; font-size:0.72rem; padding:3px 9px; border-radius:20px; background:#0f1119; border:1px solid var(--border); color:var(--text-dim); }
  .tree-empty{ color:var(--text-dim); font-size:0.9rem; }

  /* branching mini-storylines */
  .story-overlay{ position:fixed; inset:0; background:rgba(8,9,14,0.88); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:60; padding:24px; }
  .story-panel{ background:var(--panel); border:1px solid var(--accent); border-radius:16px; padding:26px; max-width:440px; width:100%; text-align:center; }
  .story-prompt{ color:var(--text); font-size:0.95rem; line-height:1.5; margin:0 0 20px; }
  .story-choices{ display:flex; flex-direction:column; gap:10px; }
  .story-choice-btn{ width:100%; }

  /* achievements */
  .ach-list{ display:flex; flex-direction:column; gap:8px; }
  .ach-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 12px; background:#161a26; border:1px solid var(--border); border-radius:10px; opacity:0.55; }
  .ach-row.got{ opacity:1; border-color:var(--warn); background:#1f1a10; }
  .ach-icon{ font-size:1.1rem; line-height:1.3; }
  .ach-body{ display:flex; flex-direction:column; }
  .ach-label{ font-size:0.86rem; font-weight:700; }
  .ach-desc{ font-size:0.76rem; color:var(--text-dim); margin-top:2px; }
  .event .tag{ color:var(--text-dim); font-weight:400; font-size:0.72rem; display:block; margin-top:2px; }

  .death-panel{ text-align:center; }
  .death-panel h2{ color:var(--bad); margin-bottom:4px; }
  .death-panel .epitaph{ color:var(--text-dim); margin-bottom:18px; }
  .stat-summary{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; margin:16px 0; }
  .stat-summary div{ text-align:center; }
  .stat-summary .val{ font-size:1.3rem; font-weight:700; }
  .stat-summary .lbl{ font-size:0.75rem; color:var(--text-dim); }
  .share-box{ margin:18px auto; max-width:480px; text-align:left; background:#161a26; border:1px solid var(--border); border-radius:10px; padding:14px; }
  .share-box h4{ margin:0 0 8px; font-size:0.78rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .share-box textarea{ width:100%; min-height:170px; background:#0f1119; border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'Consolas',Menlo,monospace; font-size:0.82rem; line-height:1.55; padding:10px; resize:vertical; box-sizing:border-box; }
  footer{ text-align:center; color:var(--text-dim); font-size:0.75rem; margin-top:10px; }

  /* cloud save / feedback (optional — game works fully offline without it) */
  .cloud-status{ font-size:0.74rem; color:var(--text-dim); align-self:center; margin-right:auto; }
  .id-choice-btn{ text-align:left; padding:14px; width:100%; }
  .id-choice-btn .sub-desc{ font-size:0.78rem; color:var(--text-dim); margin-top:4px; font-weight:400; }
  .id-skip-btn{ background:transparent; border:none; color:var(--text-dim); font-weight:400; text-decoration:underline; padding:6px; cursor:pointer; font-size:0.8rem; }
  #fb-text{ width:100%; min-height:120px; background:#0f1119; border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:inherit; font-size:0.88rem; padding:10px; resize:vertical; box-sizing:border-box; }
  .fb-type-btn.selected{ border-color:var(--accent); background:#1c2338; }

  /* challenge seeds */
  .challenge-banner{ background:#1f1a10; border:1px solid var(--warn); border-radius:10px; padding:14px; margin:14px 0; }
  .challenge-era-group{ margin-bottom:16px; text-align:left; }
  .challenge-era-group h4{ margin:0 0 8px; font-size:0.88rem; }
  .challenge-card{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:#161a26; border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .challenge-card-body strong{ font-size:0.88rem; }
  .challenge-card-body p{ margin:4px 0; font-size:0.78rem; color:var(--text-dim); }
  .challenge-meta{ font-size:0.72rem; color:var(--text-dim); }
  .challenge-tag{ display:inline-block; background:#1f1a10; border:1px solid var(--warn); border-radius:8px; padding:4px 10px; font-size:0.78rem; margin-bottom:10px; }
  .stats-teaser{ font-size:0.82rem; color:var(--text-dim); margin:0 0 12px; }

  /* relationship reactions */
  .reaction-npc-line{ font-style:italic; color:var(--text-dim); margin-top:-6px; }

  /* credit & loans */
  .credit-section{ margin-top:16px; }
  .credit-section h4{ margin:0 0 6px; color:var(--text-dim); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; }
  .loans-list{ font-size:0.78rem; color:var(--text-dim); line-height:1.6; margin-top:4px; }

  /* career board */
  .career-section{ margin-top:18px; }
  .career-section h4{ margin:0 0 8px; color:var(--text-dim); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; }
  .training-status{ font-size:0.8rem; color:var(--accent); margin-bottom:10px; }
  .job-tier{ margin-bottom:10px; }
  .job-tier h5{ margin:0 0 4px; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); opacity:0.8; }
  .job-row{ display:flex; justify-content:space-between; gap:8px; font-size:0.78rem; padding:3px 0; }
  .job-row .job-req{ color:var(--text-dim); text-align:right; }
  .job-row.locked{ opacity:0.55; }
  .job-row.current{ color:var(--accent); font-weight:600; }

  /* help & FAQ */
  .faq-panel{ max-width:640px; max-height:82vh; display:flex; flex-direction:column; }
  .faq-panel #faq-search-input{ margin:12px 0 10px; flex-shrink:0; }
  .faq-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; flex-shrink:0; }
  .faq-chip{ background:#1b2030; color:var(--text-dim); border:1px solid var(--border); border-radius:999px; padding:5px 12px; font-size:0.76rem; cursor:pointer; }
  .faq-chip.active{ background:var(--accent); color:#0b0d14; border-color:var(--accent); font-weight:600; }
  .faq-results{ overflow-y:auto; }
  .faq-category-group{ margin-bottom:16px; }
  .faq-category-group h4{ margin:0 0 8px; font-size:0.78rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .faq-item{ border-bottom:1px solid var(--border); }
  .faq-item:last-child{ border-bottom:none; }
  .faq-question{ display:block; width:100%; text-align:left; background:none; border:none; color:var(--text); font-size:0.88rem; padding:9px 2px; cursor:pointer; }
  .faq-question:hover{ color:var(--accent); }
  .faq-answer{ font-size:0.82rem; color:var(--text-dim); line-height:1.55; padding:0 2px 12px 18px; }
  .faq-empty{ color:var(--text-dim); font-size:0.85rem; padding:12px 2px; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Bloodline</h1>
    <p>A multi-era, multi-generational life sim — prototype build</p>
  </header>
  <div id="screen-setup" class="card"></div>
  <div id="screen-game" class="card" style="display:none;"></div>
  <div id="screen-death" class="card" style="display:none;"></div>
  <div id="tree-overlay" class="tree-overlay"></div>
  <div id="story-overlay" class="story-overlay"></div>
  <div id="cloud-overlay" class="tree-overlay"></div>
  <div id="feedback-overlay" class="tree-overlay"></div>
  <div id="challenge-overlay" class="tree-overlay"></div>
  <div id="reaction-overlay" class="story-overlay"></div>
  <div id="faq-overlay" class="tree-overlay"></div>
  <input type="file" id="load-input" accept=".json,application/json" style="display:none;">
  <footer>Prototype v0.5.0 · Bloodline · manual save/load always works; cloud save is optional and off until you choose it</footer>
</div>

<script>
/* =========================================================
   BLOODLINE — prototype life sim engine (v0.2: choice-driven)
   ========================================================= */

const ERAS = [
  { id:'wildwest', name:'The Wild West', years:'1872 – 1899', desc:'Frontier towns, railroads, and hard living.', moneyRange:[5,60] },
  { id:'twenties', name:'The Roaring Twenties', years:'1920 – 1935', desc:'Jazz, bootleggers, and the crash looming ahead.', moneyRange:[10,150] },
  { id:'postwar', name:'The Postwar Boom', years:'1950 – 1968', desc:'Suburbs, factory jobs, and the American dream.', moneyRange:[50,400] },
  { id:'modern', name:'Modern Day', years:'2005 – 2026', desc:'Smartphones, gig work, and student debt.', moneyRange:[100,1200] },
  { id:'future', name:'The Near Future', years:'2061 – 2090', desc:'AI coworkers, climate strain, and orbital tourism.', moneyRange:[200,3000] },
];

/* ---------- shareable challenge seeds ----------
   Fixed starting scenarios (era + starting money + optional stat handicap)
   instead of the normal random roll. The point is a starting point two
   different players can both attempt and compare notes on afterward — shared
   via a plain URL (?challenge=id), not a new backend concept. Three per era,
   each pushing a different knob: pure poverty, a stat handicap, or both. */
const CHALLENGES = [
  { id:'ww_drifter', eraId:'wildwest', name:'Penniless Drifter', tagline:'No stake, no family land — just grit and an empty pocket.', startMoney:0 },
  { id:'ww_orphan', eraId:'wildwest', name:'Frontier Orphan', tagline:'Raised rough out here with nobody looking out for you.', startMoney:5, minusStat:'happiness' },
  { id:'ww_greenhorn', eraId:'wildwest', name:'City Greenhorn', tagline:'Book-smart back east, useless out here.', startMoney:20, minusStat:'smarts' },

  { id:'tw_off_the_boat', eraId:'twenties', name:'Off the Boat', tagline:'Just arrived in the city with everything you own on your back.', startMoney:0 },
  { id:'tw_all_flash', eraId:'twenties', name:'All Flash, No Cash', tagline:'Great wardrobe, empty wallet, and a weak head for numbers.', startMoney:15, minusStat:'smarts' },
  { id:'tw_marked', eraId:'twenties', name:'Marked', tagline:"Word is out that you crossed the wrong bootlegger.", startMoney:40, minusStat:'happiness' },

  { id:'pw_empty_handed_vet', eraId:'postwar', name:'Empty-Handed Veteran', tagline:'Back from the war with the clothes on your back and little else.', startMoney:0, minusStat:'health' },
  { id:'pw_outsider', eraId:'postwar', name:'Outsider in the Suburbs', tagline:"Doesn't fit the mold the neighborhood expects.", startMoney:30, minusStat:'happiness' },
  { id:'pw_factory_kid', eraId:'postwar', name:'Factory Floor Kid', tagline:'Raised on shift work, not schoolbooks.', startMoney:50, minusStat:'smarts' },

  { id:'md_broke_grad', eraId:'modern', name:'Broke Grad', tagline:'A diploma, a mountain of debt, and $0 to show for it.', startMoney:0, minusStat:'happiness' },
  { id:'md_gig_grind', eraId:'modern', name:'Gig Economy Grind', tagline:'No benefits, no safety net, just the next gig.', startMoney:20, minusStat:'health' },
  { id:'md_offline', eraId:'modern', name:'Off the Grid', tagline:'No following, no online presence — starting from zero visibility.', startMoney:60, minusStat:'looks' },

  { id:'ft_displaced', eraId:'future', name:'Displaced', tagline:'Climate resettlement left you starting over with nothing.', startMoney:0, minusStat:'happiness' },
  { id:'ft_unaugmented', eraId:'future', name:'Unaugmented', tagline:"Everyone around you has the upgrades. You don't.", startMoney:50, minusStat:'smarts' },
  { id:'ft_orbital_debt', eraId:'future', name:'Orbital Debt', tagline:'Bought a ticket to a better life, and now you owe for it.', startMoney:10, minusStat:'health' },
];
function challengesByEra(eraId){ return CHALLENGES.filter(ch => ch.eraId === eraId); }

// Era-flavored first-name pools (~30 each, so ~150 total instead of the old
// flat 24) — loosely matched to what was actually common in each period,
// the same way "Mildred" reads as 1920s and "Kevin" reads as 1980s. Falls
// back to the flat FIRST_NAMES union wherever era context isn't available.

const DEGREE_COOLDOWN_YEARS = 3;
function degreeById(id){
  for(const eraId in DEGREE_TYPES){ const found = DEGREE_TYPES[eraId].find(d=>d.id===id); if(found) return found; }
  return null;
}
function hasDegree(c, id){ return (c.degrees||[]).includes(id); }
function degreeOnCooldown(c, id){ return c.degreeCooldowns && c.degreeCooldowns[id] != null && c.age < c.degreeCooldowns[id]; }
function degreeOptionsAvailable(c, eraId){
  return (DEGREE_TYPES[eraId]||[]).some(d => c.age >= d.minAge && !hasDegree(c,d.id) && !degreeOnCooldown(c,d.id));
}
// Base 55% pass chance, plus up to +40% from Smarts (100 smarts -> 95% pass).
function degreePassChance(c){ return clamp(55 + (c.stats.smarts||0) * 0.4, 5, 95) / 100; }
function processEnrollment(c){
  if(!c.enrolled) return;
  c.enrolled.yearsLeft -= 1;
  if(c.enrolled.yearsLeft > 0) return;
  const deg = degreeById(c.enrolled.id);
  const passed = Math.random() < degreePassChance(c);
  if(passed){
    c.degrees = c.degrees || [];
    c.degrees.push(c.enrolled.id);
    logEvent(c, `${firstName(c.name)} completed the ${deg.label} — a real credential, and doors that were closed just opened.`, 'good', true);
  } else {
    c.degreeCooldowns = c.degreeCooldowns || {};
    c.degreeCooldowns[c.enrolled.id] = c.age + DEGREE_COOLDOWN_YEARS;
    logEvent(c, `${firstName(c.name)} didn't make it through the ${deg.label} — all that time and money, and it didn't pan out. Might be worth trying again in a few years.`, 'bad');
  }
  c.enrolled = null;
  // Whether it worked out or not, training is over — time to go earn a
  // living again (a passed credential means assignStandardJob can now pick
  // from the desirable tier it unlocks; a failed attempt just goes back to
  // whatever the character otherwise qualifies for).
  if(c.age < 18){
    const era = ERAS[c.eraIndex];
    const job = bestQualifyingTeenJob(c, era.id);
    c.job = job.title; c.salary = randInt(8,25);
    if(!relByRole(c,'boss')) addRelationship(c, 'boss', pick(BOSS_NAMES));
    logEvent(c, `${firstName(c.name)} put the training to use with a part-time job as a ${job.title}.`, '');
  } else if(!c.sportsStage || c.sportsStage === 'school'){
    const { title, tier } = assignStandardJob(c);
    const verb = tier === 'desirable' ? 'landed a real career as a' : 'took a job as a';
    logEvent(c, `${firstName(c.name)} ${verb} ${title}.`, tier === 'desirable' ? 'good' : '');
  }
}

const JOB_TIER_PAY_MULT = { fallback:0.35, standard:0.6, desirable:1.0 };

function meetsPrereq(c, prereq){
  if(!prereq) return true;
  if(prereq.str && (c.stats.strength||0) < prereq.str) return false;
  if(prereq.agi && (c.stats.agility||0) < prereq.agi) return false;
  if(prereq.smt && (c.stats.smarts||0) < prereq.smt) return false;
  if(prereq.img && (c.stats.imagination||0) < prereq.img) return false;
  if(prereq.lks && (c.stats.looks||0) < prereq.lks) return false;
  if(prereq.age && c.age < prereq.age) return false;
  if(prereq.degree && !hasDegree(c, prereq.degree)) return false;
  return true;
}
function prereqText(prereq){
  if(!prereq || Object.keys(prereq).length === 0) return 'No requirements';
  const parts = [];
  if(prereq.str) parts.push(`Strength ${prereq.str}+`);
  if(prereq.agi) parts.push(`Agility ${prereq.agi}+`);
  if(prereq.smt) parts.push(`Smarts ${prereq.smt}+`);
  if(prereq.img) parts.push(`Imagination ${prereq.img}+`);
  if(prereq.lks) parts.push(`Looks ${prereq.lks}+`);
  if(prereq.age) parts.push(`Age ${prereq.age}+`);
  if(prereq.degree){ const d = degreeById(prereq.degree); parts.push(d ? d.label : prereq.degree); }
  return parts.join(', ');
}
// Picks the best job the character currently qualifies for (desirable over
// standard over fallback), randomizing among ties so two characters who
// both qualify for the top tier don't always land the exact same title.
function bestQualifyingJob(c, eraId){
  const pool = JOBS[eraId];
  if(!pool) return null;
  for(const tier of ['desirable','standard','fallback']){
    const qualifying = (pool[tier]||[]).filter(j => meetsPrereq(c, j.prereq));
    if(qualifying.length) return { ...pick(qualifying), tier };
  }
  return { title:'Odd Jobs', tier:'fallback', prereq:{} };
}
function bestQualifyingTeenJob(c, eraId){
  const pool = (JOBS[eraId]||{}).teen || [];
  const qualifying = pool.filter(j => meetsPrereq(c, j.prereq));
  return qualifying.length ? pick(qualifying) : { title:'Odd Jobs', prereq:{} };
}
// Second jobs stay unrestricted by design (Sean's call — it's a hustle, not
// a specialization) — picks from every job in the era regardless of prereqs.
function anyJobTitle(eraId){
  const pool = JOBS[eraId];
  if(!pool) return 'Odd Jobs';
  const all = [...(pool.fallback||[]), ...(pool.standard||[]), ...(pool.desirable||[])];
  return pick(all).title;
}

/* ---------- career ladder: raises & second jobs ----------
   Salary isn't static once you're hired — it grows every year on the job,
   split into two parts on purpose: a small baseline raise just for staying
   (tenure), and a performance multiplier tied to smarts so two people in the
   same job grow at different rates. A second job is real extra income, but
   it costs something every year it's active (health or happiness, picked at
   random so it doesn't always hit the same stat) rather than being free
   money — the tradeoff Sean asked for over a flat income bonus. */
const TENURE_RAISE_BASE = 0.02;   // baseline raise every year, even at zero tenure
const TENURE_RAISE_STEP = 0.005;  // additional raise per year of tenure
const TENURE_RAISE_CAP = 0.08;    // tenure alone can't push the raise past this
function jobPerformanceMultiplier(c){
  // 0 smarts -> 0.5x, 50 smarts -> 1.0x, 100 smarts -> 1.5x
  return 0.5 + (c.stats.smarts||0) / 100;
}
function applyJobRaise(c){
  if(!c.job || c.age < 18) return 0;
  c.jobTenure = (c.jobTenure||0) + 1;
  const tenurePct = Math.min(TENURE_RAISE_CAP, TENURE_RAISE_BASE + (c.jobTenure-1) * TENURE_RAISE_STEP);
  const raise = Math.round(c.salary * tenurePct * jobPerformanceMultiplier(c));
  c.salary += raise;
  return raise;
}
// Shared by the standard age-18 hire and the age-22 "college athletics
// didn't work out" fallback, so both paths stay in sync.
function assignStandardJob(c){
  const era = ERAS[c.eraIndex];
  const job = bestQualifyingJob(c, era.id);
  c.job = job.title;
  c.salary = Math.round(randInt(...era.moneyRange) * JOB_TIER_PAY_MULT[job.tier] + 20);
  c.jobTenure = 0;
  if(!relByRole(c,'boss')) addRelationship(c, 'boss', pick(BOSS_NAMES));
  addRelationship(c, 'coworker', firstNameForEra(era.id)+' '+pick(LAST_NAMES));
  return { title: job.title, tier: job.tier, highSmarts: job.tier === 'desirable' };
}
const SECOND_JOB_HEALTH_COST = [2,5];
const SECOND_JOB_HAPPINESS_COST = [2,5];
function secondJobPenalty(c){
  if(Math.random() < 0.5) c.stats.health = clamp(c.stats.health - randInt(...SECOND_JOB_HEALTH_COST));
  else c.stats.happiness = clamp(c.stats.happiness - randInt(...SECOND_JOB_HAPPINESS_COST));
}

/* ---------- credit, loans & financing ----------
   One underlying 300-850 number so the loan math stays simple, but it's
   never shown as a bare "credit score" outside the eras where that concept
   actually existed — Modern/Future call it that; earlier eras get the
   period-honest framing (a banker's opinion of you, not a bureau's). Same
   number, different name and different available products, the same way
   the rest of the game varies by era without needing five parallel systems. */
const CREDIT_LABEL = {
  wildwest: 'Standing at the Bank',
  twenties: 'Character Reference',
  postwar: 'Credit Standing',
  modern: 'Credit Score',
  future: 'Trust Rating',
};
const STARTING_CREDIT_SCORE = 620; // "fair" — a plausible, unremarkable starting point
const CREDIT_DENY_THRESHOLD = 500; // below this, lenders won't finance anything
const LOAN_TERMS = { vehicle: 4, mortgage: 10 }; // in game-years
function creditRateFor(score){
  if(score >= 740) return 0.05;
  if(score >= 670) return 0.08;
  if(score >= 580) return 0.13;
  return 0.19;
}
function creditTierLabel(score){
  if(score >= 740) return 'Excellent';
  if(score >= 670) return 'Good';
  if(score >= 580) return 'Fair';
  return 'Poor';
}
// Simple level-payment loan: fixed yearly payment across the term at the
// rate locked in when financed (rate doesn't float with the score later —
// realistic, and it means an early bad-credit purchase has a lasting,
// visible cost instead of quietly fixing itself).
function yearlyLoanPayment(principal, rate, years){
  if(rate <= 0) return Math.ceil(principal / years);
  const r = rate;
  const payment = principal * (r * Math.pow(1+r, years)) / (Math.pow(1+r, years) - 1);
  return Math.ceil(payment);
}
function startLoan(c, item){
  const downPayment = Math.round(item.cost * 0.2);
  const principal = item.cost - downPayment;
  const rate = creditRateFor(c.creditScore);
  const years = LOAN_TERMS[item.loanType] || 5;
  const payment = yearlyLoanPayment(principal, rate, years);
  c.money -= downPayment;
  c.loans.push({
    id:'loan_'+item.id+'_'+(c.loans.length), itemId:item.id, itemLabel:item.label, type:item.loanType,
    principal, balance:principal, rate, years, yearsPaid:0, payment,
  });
  c.owned.push(item.id);
  applyEffectSpec(c, item.effect, null);
}
// Runs once per completed year — collects the year's payment on every active
// loan, or logs a missed payment if the money isn't there. Deliberately
// simple (no grace period, no partial payments) so the consequence of
// financing more than you can afford stays visible and immediate.
function processLoans(c){
  if(!c.loans || !c.loans.length) return;
  c.loans.forEach(loan=>{
    if(loan.balance <= 0) return;
    if(c.money >= loan.payment){
      c.money -= loan.payment;
      loan.balance = Math.max(0, loan.balance - (loan.payment - Math.round(loan.balance * loan.rate)));
      // Interest-then-principal above can undershoot on the final year's
      // rounding; force it closed once yearsPaid hits the term either way.
      loan.yearsPaid += 1;
      if(loan.yearsPaid >= loan.years) loan.balance = 0;
      c.creditScore = clamp850(c.creditScore + randInt(2,5));
      if(loan.balance <= 0){
        logEvent(c, `${firstName(c.name)} made the final payment on ${loan.itemLabel.toLowerCase()} — paid off free and clear.`, 'good');
      }
    } else {
      c.creditScore = clamp850(c.creditScore - randInt(15,30));
      logEvent(c, `${firstName(c.name)} missed a payment on ${loan.itemLabel.toLowerCase()} — ${CREDIT_LABEL[ERAS[c.eraIndex].id]} took a hit.`, 'bad');
    }
  });
  c.loans = c.loans.filter(loan => loan.balance > 0);
}
function clamp850(v){ return Math.max(300, Math.min(850, v)); }
function outstandingDebt(c){ return (c.loans||[]).reduce((sum,l)=>sum+(l.balance||0), 0); }

/* ---------- utils ---------- */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function clamp(v){ return Math.max(0, Math.min(100, v)); }
function firstName(full){ return full.split(' ')[0]; }
function ageBracket(age){
  if(age<=1) return 'infant';
  if(age<=4) return 'toddler';
  if(age<=12) return 'kid';
  if(age<=17) return 'teen';
  if(age<=64) return 'adult';
  return 'senior';
}
function rollRange(r){ return Array.isArray(r) ? randInt(r[0],r[1]) : (r||0); }

/* Anti-repeat text picker: cycles through variants before allowing a repeat */
function pickText(c, key, variants){
  if(!c._usedText) c._usedText = {};
  if(!c._usedText[key]) c._usedText[key] = [];
  let used = c._usedText[key];
  if(used.length >= variants.length) used = c._usedText[key] = [];
  let idx;
  do { idx = randInt(0, variants.length-1); } while(used.includes(idx) && used.length < variants.length);
  used.push(idx);
  return variants[idx];
}

// Teacher/boss names are seeded "Mr./Mrs./Ms. Surname" — splitting on the first
// space like a normal first name would truncate them to just the title.
function displayName(r){
  return (r && (r.role === 'teacher' || r.role === 'boss')) ? r.name : firstName(r ? r.name : '');
}
function fill(template, c, target){
  return template.replace(/{name}/g, firstName(c.name)).replace(/{target}/g, target ? displayName(target) : '');
}

/* ---------- relationships ---------- */
let relCounter = 0;
function addRelationship(c, role, name, extra){
  const rel = Object.assign({ id:'r'+(relCounter++), role, name, closeness: randInt(50,72), active:true }, extra||{});
  c.relationships.push(rel);
  return rel;
}
function relsByRole(c, role){ return c.relationships.filter(r=>r.active && r.role===role); }
function relByRole(c, role){ return relsByRole(c, role)[0]; }

function makeFamily(eraId, surname){
  const rels = [];
  rels.push({role:'mother', name: firstNameForEra(eraId)+' '+surname});
  rels.push({role:'father', name: firstNameForEra(eraId)+' '+surname});
  const numSiblings = randInt(0,2);
  for(let i=0;i<numSiblings;i++) rels.push({role:'sibling', name: firstNameForEra(eraId)+' '+surname});
  const species = pick(PET_SPECIES[eraId]);
  rels.push({role:'pet', name: pick(PET_NAMES), species});
  return { rels };
}

// Family members and future generations should share the player's actual
// last name when they gave one, rather than a disconnected random surname.
function deriveSurname(name){
  const parts = String(name).trim().split(/\s+/);
  return parts.length > 1 ? parts[parts.length - 1] : pick(LAST_NAMES);
}

  return (out[bracket] || []).filter(ev =>
    (ev.minEraIndex == null || eraIndex >= ev.minEraIndex) &&
    (ev.maxEraIndex == null || eraIndex <= ev.maxEraIndex));
}

function storiesFor(bracket, eraId){
  const eraIndex = ERAS.findIndex(e=>e.id===eraId);
  const inEra = s => (!s.brackets || s.brackets.includes(bracket)) && (s.minEraIndex == null || eraIndex >= s.minEraIndex);
  const generic = MINI_STORIES.filter(inEra);
  const eraSpecific = (ERA_MINI_STORIES[eraId] || []).filter(inEra);
  return generic.concat(eraSpecific);
}

  overlay.style.display = 'flex';
  overlay.querySelectorAll('.story-choice-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      const choice = story.choices[idx];
      let effect = choice.effect || {};
      if(choice.imaginationScaled && effect.money){
        // Nudge the risky-choice money range by imagination: a more creative
        // character (imagination well above the 25-55 starting range) spots
        // more upside; a less creative one skews toward the downside.
        const bonus = Math.round(((c.stats.imagination||0) - 50) / 5);
        effect = Object.assign({}, effect, { money: [effect.money[0] + bonus, effect.money[1] + bonus] });
      }
      const deltas = applyEffectSpec(c, effect, null);
      logEvent(c, fill(choice.result, c, null), choice.cls || eventClassFromDeltas(deltas));
      overlay.style.display = 'none';
      overlay.innerHTML = '';
      onDone();
    };
  });
}

/* ---------- cumulative Bloodline Score ---------- */
// A blended number across the whole family line (wealth + longevity +
// achievements) — a personal record to try to beat on the next attempt,
// without needing multiplayer or accounts.
function computeBloodlineScore(){
  let score = 0;
  const lives = state.familyLog.slice();
  // Only add state.char separately while alive — once dead, killCharacter()
  // has already recorded them in familyLog, so this avoids double-counting
  // the same life (same dedup rule as buildTreeChain above).
  if(state.char && state.char.alive) lives.push({ money: (state.char.money||0), savings: (state.char.savings||0), debt: outstandingDebt(state.char), age: state.char.age });
  lives.forEach(f=>{
    // Net worth = cash + savings minus any outstanding loan balance — a life
    // that built up savings shouldn't score lower than one that kept the
    // same amount as loose cash, and a life carrying debt shouldn't score
    // as if that debt weren't owed.
    score += Math.round(((f.money||0) + (f.savings||0) - (f.debt||0)) / 100);
    score += (f.age||0) * 3;
  });
  score += (state.achievementsUnlocked ? state.achievementsUnlocked.length : 0) * 25;
  return score;
}

/* ---------- achievements ---------- */
// Checked continuously against the living character (and the family as a
// whole); once unlocked, an achievement stays unlocked for the rest of the
// bloodline — a checklist to give structure to "what should I try this time."
const ACHIEVEMENTS = [
  { id:'centenarian', label:'Live to 100', desc:'Reach age 100.', scope:'life', check:c => c.age >= 100 },
  { id:'millionaire', label:'Die a Millionaire', desc:'Have $1,000,000 or more between cash and savings.', scope:'life', check:c => ((c.money||0) + (c.savings||0)) >= 1000000 },
  { id:'legendary_life', label:'Legendary Life', desc:'Experience a legendary life event.', scope:'life', check:c => c.events.some(e => e.legendary) },
  { id:'black_belt', label:'Black Belt', desc:'Reach Black Belt in martial arts.', scope:'life', check:c => (c.skills && c.skills.martialArts || 0) >= 21 },
  { id:'prodigy', label:'Prodigy', desc:'Reach the Prodigy academic tier.', scope:'life', check:c => (c.skills && c.skills.academic || 0) >= 20 },
  { id:'elite_athlete', label:'Elite Athlete', desc:'Reach Elite in sports.', scope:'life', check:c => (c.skills && c.skills.sports || 0) >= 20 },
  { id:'master_artist', label:'Master Artist', desc:'Reach Master Artist in arts/music.', scope:'life', check:c => (c.skills && c.skills.arts || 0) >= 20 },
  { id:'well_rounded', label:'Well-Rounded', desc:'Reach 80+ in every stat at once.', scope:'life', check:c => ['health','happiness','smarts','looks','imagination','strength','agility'].every(k => (c.stats[k]||0) >= 80) },
  { id:'nest_egg', label:'Nest Egg', desc:'Build savings of $10,000 or more.', scope:'life', check:c => (c.savings||0) >= 10000 },
  { id:'fully_connected', label:'Fully Connected', desc:'Have a pet, a best friend, and a partner all at once.', scope:'life', check:c => ['pet','bestfriend','partner'].every(role => c.relationships.some(r => r.active && r.role === role)) },
  { id:'retired_in_style', label:'Retired in Style', desc:'Reach retirement age with $5,000 or more.', scope:'life', check:c => c.age >= 65 && ((c.money||0) + (c.savings||0)) >= 5000 },
  { id:'big_winner', label:'Big Winner', desc:'Land a huge investment payoff.', scope:'life', check:c => !!c.hadGreatInvestment },
  { id:'dynasty', label:'Dynasty', desc:'Carry the bloodline to Generation 5.', scope:'family', check:s => s.generation >= 5 },
  { id:'century_bloodline', label:'Century Bloodline', desc:'Reach a Bloodline Score of 500 or more.', scope:'family', check:s => computeBloodlineScore() >= 500 },
];
function checkAchievements(){
  if(!state.achievementsUnlocked) state.achievementsUnlocked = [];
  const c = state.char;
  const newlyUnlocked = [];
  ACHIEVEMENTS.forEach(a=>{
    if(state.achievementsUnlocked.includes(a.id)) return;
    let earned = false;
    if(a.scope === 'life' && c) earned = !!a.check(c);
    else if(a.scope === 'family') earned = !!a.check(state);
    if(earned){ state.achievementsUnlocked.push(a.id); newlyUnlocked.push(a); }
  });
  return newlyUnlocked;
}

let faqQuery = '';
let faqCategory = 'All';
let faqExpanded = new Set();
function faqMatches(entry, query){
  if(!query) return true;
  const hay = (entry.q + ' ' + entry.a + ' ' + (entry.tags||[]).join(' ')).toLowerCase();
  return hay.includes(query.toLowerCase());
}
function faqFilteredEntries(){
  return FAQ_ENTRIES.filter(e => (faqCategory === 'All' || e.category === faqCategory) && faqMatches(e, faqQuery));
}
function faqResultsHtml(){
  const entries = faqFilteredEntries();
  if(!entries.length){
    return `<div class="faq-empty">No FAQ entries match "${escapeHtml(faqQuery)}". Try a different search term, or use the Feedback button to ask directly.</div>`;
  }
  const order = [];
  const byCategory = {};
  entries.forEach(e => {
    if(!byCategory[e.category]){ byCategory[e.category] = []; order.push(e.category); }
    byCategory[e.category].push(e);
  });
  return order.map(cat => `
    <div class="faq-category-group">
      <h4>${escapeHtml(cat)}</h4>
      ${byCategory[cat].map(e => `
        <div class="faq-item">
          <button class="faq-question" data-id="${e.id}">${faqExpanded.has(e.id) ? '▾' : '▸'} ${escapeHtml(e.q)}</button>
          ${faqExpanded.has(e.id) ? `<div class="faq-answer">${escapeHtml(e.a)}</div>` : ''}
        </div>`).join('')}
    </div>`).join('');
}
function faqChipsHtml(){
  const cats = ['All'].concat(Array.from(new Set(FAQ_ENTRIES.map(e=>e.category))));
  return cats.map(cat => `<button class="faq-chip${faqCategory===cat?' active':''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`).join('');
}
function wireFaqResults(){
  const overlay = document.getElementById('faq-overlay');
  overlay.querySelectorAll('.faq-question').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.id;
      if(faqExpanded.has(id)) faqExpanded.delete(id); else faqExpanded.add(id);
      document.getElementById('faq-results').innerHTML = faqResultsHtml();
      wireFaqResults();
    };
  });
}
function wireFaqChips(){
  const overlay = document.getElementById('faq-overlay');
  overlay.querySelectorAll('.faq-chip').forEach(btn=>{
    btn.onclick = ()=>{
      faqCategory = btn.dataset.cat;
      document.getElementById('faq-chip-row').innerHTML = faqChipsHtml();
      document.getElementById('faq-results').innerHTML = faqResultsHtml();
      wireFaqChips();
      wireFaqResults();
    };
  });
}
// The search box's own innerHTML is never touched after creation (only the
// #faq-results / #faq-chip-row children get replaced on input/category
// change) — re-assigning the input element itself on every keystroke would
// steal focus and make typing effectively broken.
function openFaqModal(){
  faqQuery = ''; faqCategory = 'All'; faqExpanded = new Set();
  const overlay = document.getElementById('faq-overlay');
  overlay.innerHTML = `
    <div class="tree-panel faq-panel">
      <button class="tree-close" id="faq-close-btn" aria-label="Close">✕</button>
      <h2 style="margin-top:0;">Help &amp; FAQ</h2>
      <input type="text" id="faq-search-input" placeholder="Search questions (e.g. &quot;credit score&quot;, &quot;second job&quot;, &quot;achievements&quot;)" />
      <div class="faq-chip-row" id="faq-chip-row">${faqChipsHtml()}</div>
      <div class="faq-results" id="faq-results">${faqResultsHtml()}</div>
    </div>`;
  overlay.style.display = 'flex';
  document.getElementById('faq-close-btn').onclick = closeFaqModal;
  overlay.onclick = (e)=>{ if(e.target === overlay) closeFaqModal(); };
  document.getElementById('faq-search-input').oninput = (e)=>{
    faqQuery = e.target.value;
    document.getElementById('faq-results').innerHTML = faqResultsHtml();
    wireFaqResults();
  };
  wireFaqChips();
  wireFaqResults();
}
function closeFaqModal(){
  const overlay = document.getElementById('faq-overlay');
  overlay.style.display = 'none';
  overlay.innerHTML = '';
}

function openAchievements(){
