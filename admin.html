<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloodline — Stats Dashboard</title>
<style>
  :root{
    --bg:#12141c; --panel:#1a1e2a; --border:#2b3142;
    --text:#e9ebf2; --text-dim:#9aa1b4;
    --accent:#7c9eff; --accent-2:#c98bff;
    --good:#4fd18b; --warn:#f2c94c; --bad:#f2685c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--text); padding:24px 16px 60px; display:flex; justify-content:center;
  }
  #app{ width:100%; max-width:920px; }
  h1{ font-size:1.5rem; margin:0 0 4px; }
  .sub{ color:var(--text-dim); font-size:0.85rem; margin:0 0 24px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:16px; }
  .card h2{ margin:0 0 16px; font-size:1rem; }
  input[type=text],input[type=password]{ width:100%; max-width:320px; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:#0f1119; color:var(--text); font-size:0.95rem; }
  button{ font-family:inherit; font-size:0.9rem; font-weight:600; border:none; border-radius:10px; padding:10px 16px; cursor:pointer; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#0f1119; margin-left:8px; }
  button:hover{ filter:brightness(1.08); }
  .tile-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .tile{ background:#161a26; border:1px solid var(--border); border-radius:10px; padding:14px; }
  .tile .val{ font-size:1.5rem; font-weight:700; }
  .tile .lbl{ font-size:0.76rem; color:var(--text-dim); margin-top:2px; }
  .bar-row{ margin-bottom:12px; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-label{ display:flex; justify-content:space-between; font-size:0.82rem; margin-bottom:5px; }
  .bar-label .name{ font-weight:600; }
  .bar-label .n{ color:var(--text-dim); }
  .bar-track{ height:8px; border-radius:6px; background:#0f1119; overflow:hidden; border:1px solid var(--border); }
  .bar-fill{ height:100%; border-radius:6px; background:var(--accent); }
  .fb-item{ background:#161a26; border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:0.85rem; line-height:1.4; }
  .fb-item.suggestion{ border-left-color:var(--accent-2); }
  .fb-item .fb-meta{ color:var(--text-dim); font-size:0.72rem; margin-top:4px; }
  .empty{ color:var(--text-dim); font-size:0.85rem; }
  .error{ color:var(--bad); font-size:0.85rem; margin-top:10px; }
  #gate{ text-align:center; margin-top:60px; }
</style>
</head>
<body>
<div id="app">
  <div id="gate">
    <h1>Bloodline Stats</h1>
    <p class="sub">Enter your admin key (the ADMIN_KEY you set in Netlify's site environment variables) to view the dashboard. Nothing here is public — this page just asks the stats function for the numbers, gated by that key.</p>
    <input type="password" id="key-input" placeholder="Admin key">
    <button id="unlock-btn">View Dashboard</button>
    <div class="error" id="gate-error"></div>
  </div>
  <div id="dashboard" style="display:none;"></div>
</div>
<script>
function fmt(n){ return (n||0).toLocaleString(); }

async function loadStats(key){
  const res = await fetch(`/.netlify/functions/stats?key=${encodeURIComponent(key)}`);
  if(!res.ok){
    const body = await res.json().catch(()=>({}));
    throw new Error(body.error === 'unauthorized' ? 'Wrong admin key.' : `Could not load stats (${res.status}). Is the backend deployed yet?`);
  }
  return res.json();
}

function render(data){
  document.getElementById('gate').style.display = 'none';
  const dash = document.getElementById('dashboard');
  const achRows = Object.entries(data.achievements || {})
    .sort((a,b)=> b[1].pct - a[1].pct)
    .map(([id,a])=>`
      <div class="bar-row">
        <div class="bar-label"><span class="name">${a.label}</span><span class="n">${a.pct}% · ${fmt(a.count)} of ${fmt(data.totalDeaths)} lives</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,a.pct)}%;"></div></div>
      </div>`).join('') || '<div class="empty">No completed lives recorded yet.</div>';

  const eraEntries = Object.entries(data.eraStarts || {});
  const maxEra = Math.max(1, ...eraEntries.map(e=>e[1]));
  const eraRows = eraEntries
    .sort((a,b)=> b[1]-a[1])
    .map(([era,count])=>`
      <div class="bar-row">
        <div class="bar-label"><span class="name">${era}</span><span class="n">${fmt(count)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((count/maxEra)*100)}%;"></div></div>
      </div>`).join('') || '<div class="empty">No lives started yet.</div>';

  const feedbackRows = (data.recentFeedback || []).map(f=>`
    <div class="fb-item ${f.type}">
      <div>${f.type === 'bug' ? '🐛' : '💡'} ${escapeHtml(f.text)}</div>
      <div class="fb-meta">${new Date(f.createdAt).toLocaleString()}${f.context && f.context.era ? ` · ${escapeHtml(f.context.era)}, age ${f.context.age}` : ''}</div>
    </div>`).join('') || '<div class="empty">No feedback submitted yet.</div>';

  dash.style.display = 'block';
  dash.innerHTML = `
    <p class="sub">Last updated ${data.updatedAt ? new Date(data.updatedAt).toLocaleString() : 'never — no play data yet'}.</p>
    <div class="card">
      <h2>Players</h2>
      <div class="tile-grid">
        <div class="tile"><div class="val">${fmt(data.totalPlayers)}</div><div class="lbl">Total players</div></div>
        <div class="tile"><div class="val">${fmt(data.repeatPlayers)}</div><div class="lbl">Repeat players</div></div>
        <div class="tile"><div class="val">${data.repeatPct}%</div><div class="lbl">Repeat rate</div></div>
        <div class="tile"><div class="val">${fmt(data.totalSessions)}</div><div class="lbl">Total sessions</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Play</h2>
      <div class="tile-grid">
        <div class="tile"><div class="val">${fmt(data.totalLivesStarted)}</div><div class="lbl">Lives started</div></div>
        <div class="tile"><div class="val">${fmt(data.totalDeaths)}</div><div class="lbl">Lives completed</div></div>
        <div class="tile"><div class="val">${fmt(data.feedbackCount)}</div><div class="lbl">Feedback items</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Lives started by era</h2>
      ${eraRows}
    </div>
    <div class="card">
      <h2>Achievement unlock rate <span style="color:var(--text-dim);font-weight:400;font-size:0.78rem;">(% of completed lives)</span></h2>
      ${achRows}
    </div>
    <div class="card">
      <h2>Recent feedback <span style="color:var(--text-dim);font-weight:400;font-size:0.78rem;">(latest 50)</span></h2>
      ${feedbackRows}
    </div>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

async function unlock(){
  const key = document.getElementById('key-input').value.trim();
  const errEl = document.getElementById('gate-error');
  errEl.textContent = '';
  if(!key){ errEl.textContent = 'Enter your admin key.'; return; }
  try{
    const data = await loadStats(key);
    sessionStorage.setItem('bloodline_admin_key', key);
    render(data);
  } catch(e){
    errEl.textContent = e.message;
  }
}
document.getElementById('unlock-btn').onclick = unlock;
document.getElementById('key-input').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });

// Reuse the key for this browser tab's session so a refresh doesn't ask again.
const remembered = sessionStorage.getItem('bloodline_admin_key');
if(remembered){
  document.getElementById('key-input').value = remembered;
  unlock();
}
</script>
</body>
</html>
