<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloodline — A Multi-Era Life Sim</title>
<!-- Optional cloud save / sign-in. Leave the content blank to keep the game
     fully offline (Guest mode still works with no client ID at all) — paste
     your Google OAuth Web Client ID here once you've created one to turn on
     "Sign in with Google" in the save-choice modal. See design-notes.md. -->
<meta name="google-signin-client-id" content="">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#12141c; --panel:#1a1e2a; --border:#2b3142;
    --text:#e9ebf2; --text-dim:#9aa1b4;
    --accent:#7c9eff; --accent-2:#c98bff;
    --good:#4fd18b; --warn:#f2c94c; --bad:#f2685c; --money:#4fd18b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, var(--bg-glow, #232a3d) 0%, var(--bg) 60%);
    transition:background .4s ease;
    color:var(--text); display:flex; justify-content:center; padding:24px 16px 60px;
  }
  #app{ width:100%; max-width:1040px; }
  header.top{ text-align:center; margin-bottom:20px; }
  header.top h1{
    font-size:1.8rem; margin:0 0 4px; letter-spacing:0.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header.top p{ margin:0; color:var(--text-dim); font-size:0.9rem; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:16px; }

  /* setup */
  .era-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:16px 0; }
  .era-option{ border:2px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; transition:border-color .15s, transform .15s; background:#161a26; }
  .era-option:hover{ transform:translateY(-2px); }
  .era-option.selected{ border-color:var(--accent); background:#1c2338; }
  .era-option h3{ margin:0 0 4px; font-size:1rem; }
  .era-option span{ color:var(--text-dim); font-size:0.8rem; }
  label{ display:block; font-size:0.85rem; color:var(--text-dim); margin:14px 0 6px; }
  input[type=text]{ width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:#0f1119; color:var(--text); font-size:1rem; }
  input[type=text]:focus{ outline:none; border-color:var(--accent); }
  button{ font-family:inherit; font-size:0.9rem; font-weight:600; border:none; border-radius:10px; padding:10px 16px; cursor:pointer; transition:filter .15s, transform .1s; }
  button:active{ transform:scale(0.98); }
  button:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-primary{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#0f1119; }
  .btn-primary:hover:not(:disabled){ filter:brightness(1.08); }
  .btn-secondary{ background:#262c3d; color:var(--text); border:1px solid var(--border); }
  .btn-secondary:hover:not(:disabled){ filter:brightness(1.15); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }

  /* game */
  .game-layout{ display:grid; grid-template-columns:280px 1fr; gap:16px; }
  @media (max-width:760px){ .game-layout{ grid-template-columns:1fr; } }
  .char-header{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .avatar-svg{ flex-shrink:0; border-radius:50%; }
  .char-header h2{ margin:0; font-size:1.2rem; }
  .char-header .meta{ color:var(--text-dim); font-size:0.82rem; }
  .stat-row{ margin-bottom:10px; }
  .stat-label{ display:flex; justify-content:space-between; font-size:0.78rem; color:var(--text-dim); margin-bottom:4px; }
  .stat-bar{ height:8px; border-radius:6px; background:#0f1119; overflow:hidden; border:1px solid var(--border); }
  .stat-fill{ height:100%; border-radius:6px; transition:width .3s ease; }
  .stat-health .stat-fill{ background:var(--bad); }
  .stat-happiness .stat-fill{ background:var(--warn); }
  .stat-smarts .stat-fill{ background:var(--accent); }
  .stat-looks .stat-fill{ background:var(--accent-2); }
  .stat-imagination .stat-fill{ background:#e0a4f2; }
  .money-line{ display:flex; justify-content:space-between; align-items:center; background:#0f1119; border:1px solid var(--border); border-radius:10px; padding:9px 12px; margin-top:12px; font-weight:600; font-size:0.9rem; }
  .money-line .amt{ color:var(--money); }
  .job-line{ font-size:0.78rem; color:var(--text-dim); margin-top:6px; }

  .rel-section h4, .owned-section h4, .legacy-box h4{ margin:14px 0 8px; color:var(--text); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); }
  .rel-item{ margin-bottom:8px; }
  .rel-name{ display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:3px; }
  .rel-name .role{ color:var(--text-dim); font-weight:400; }
  .rel-bar{ height:6px; border-radius:4px; background:#0f1119; overflow:hidden; border:1px solid var(--border); }
  .rel-fill{ height:100%; border-radius:4px; background:var(--accent-2); }
  .owned-list{ font-size:0.78rem; color:var(--text-dim); line-height:1.6; }
  .skills-box{ font-size:0.78rem; color:var(--text-dim); line-height:1.7; }
  .skills-box strong{ color:var(--text); }
  .legacy-box{ font-size:0.76rem; color:var(--text-dim); max-height:140px; overflow-y:auto; }
  .legacy-box div{ margin-bottom:6px; line-height:1.4; }
  .divider{ border-top:1px solid var(--border); margin-top:14px; padding-top:2px; }

  .tab-bar{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tab-btn{ background:#161a26; border:1px solid var(--border); color:var(--text-dim); padding:8px 14px; border-radius:9px; font-size:0.82rem; font-weight:600; }
  .tab-btn:hover{ border-color:var(--accent); color:var(--text); }
  .tab-btn.active{ background:var(--accent); color:#0f1119; border-color:var(--accent); }
  #tab-panel{ margin-bottom:16px; }
  #tab-panel:empty{ margin-bottom:0; }

  .actions-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .actions-header h3{ margin:0; font-size:1rem; }
  .actions-left{ font-size:0.8rem; color:var(--text-dim); }
  .action-cat{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-dim); margin:14px 0 6px; }
  .action-cat:first-of-type{ margin-top:0; }
  .action-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; }
  .action-btn{ text-align:left; background:#161a26; border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:9px; font-size:0.84rem; font-weight:500; }
  .action-btn:hover:not(:disabled){ border-color:var(--accent); background:#1c2338; }
  .action-btn .sub{ display:block; color:var(--text-dim); font-weight:400; font-size:0.74rem; margin-top:2px; }

  .end-year-row{ margin-top:16px; display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }

  .event-feed{ max-height:280px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px; margin-top:16px; }
  .event{ background:#161a26; border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:8px; padding:9px 12px; font-size:0.85rem; line-height:1.4; }
  .event.good{ border-left-color:var(--good); }
  .event.bad{ border-left-color:var(--bad); }
  .event.milestone{ border-left-color:var(--accent-2); font-weight:600; }
  .event.legendary{ border-left-color:var(--warn); font-weight:600; background:#1f1a10; }

  /* family tree */
  .tree-overlay{ position:fixed; inset:0; background:rgba(8,9,14,0.82); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:40px 16px; overflow-y:auto; }
  .tree-panel{ background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:26px; max-width:560px; width:100%; position:relative; }
  .tree-panel h2{ margin:0 0 4px; }
  .tree-sub{ color:var(--text-dim); font-size:0.85rem; margin-bottom:22px; }
  .tree-close{ position:absolute; top:16px; right:16px; background:#262c3d; border:1px solid var(--border); color:var(--text); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:1rem; line-height:1; }
  .tree-chain{ position:relative; padding-left:26px; }
  .tree-chain::before{ content:''; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--border); }
  .tree-node{ position:relative; margin-bottom:16px; padding:14px 16px; background:#161a26; border:1px solid var(--border); border-radius:10px; }
  .tree-node:last-child{ margin-bottom:0; }
  .tree-node::before{ content:''; position:absolute; left:-26px; top:19px; width:12px; height:12px; border-radius:50%; background:var(--node-color, var(--accent)); border:2px solid var(--panel); box-shadow:0 0 0 2px var(--node-color, var(--accent)); }
  .tree-node.current{ border-color:var(--node-color, var(--accent)); background:#1c2338; }
  .tree-node .tn-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:2px; }
  .tree-node .tn-name-row{ display:flex; align-items:center; gap:8px; }
  .tree-node .tn-name{ font-size:1rem; font-weight:700; }
  .tree-node .tn-gen{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); white-space:nowrap; }
  .tree-node .tn-era{ font-size:0.76rem; color:var(--node-color, var(--accent)); font-weight:600; margin-bottom:6px; }
  .tree-node .tn-detail{ font-size:0.8rem; color:var(--text-dim); line-height:1.5; }
  .tree-node .tn-quote{ margin-top:6px; font-style:italic; }
  .tree-node .tn-trait{ display:inline-block; margin-top:8px; font-size:0.72rem; padding:3px 9px; border-radius:20px; background:#0f1119; border:1px solid var(--border); color:var(--text-dim); }
  .tree-empty{ color:var(--text-dim); font-size:0.9rem; }

  /* branching mini-storylines */
  .story-overlay{ position:fixed; inset:0; background:rgba(8,9,14,0.88); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:60; padding:24px; }
  .story-panel{ background:var(--panel); border:1px solid var(--accent); border-radius:16px; padding:26px; max-width:440px; width:100%; text-align:center; }
  .story-prompt{ color:var(--text); font-size:0.95rem; line-height:1.5; margin:0 0 20px; }
  .story-choices{ display:flex; flex-direction:column; gap:10px; }
  .story-choice-btn{ width:100%; }

  /* achievements */
  .ach-list{ display:flex; flex-direction:column; gap:8px; }
  .ach-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 12px; background:#161a26; border:1px solid var(--border); border-radius:10px; opacity:0.55; }
  .ach-row.got{ opacity:1; border-color:var(--warn); background:#1f1a10; }
  .ach-icon{ font-size:1.1rem; line-height:1.3; }
  .ach-body{ display:flex; flex-direction:column; }
  .ach-label{ font-size:0.86rem; font-weight:700; }
  .ach-desc{ font-size:0.76rem; color:var(--text-dim); margin-top:2px; }
  .event .tag{ color:var(--text-dim); font-weight:400; font-size:0.72rem; display:block; margin-top:2px; }

  .death-panel{ text-align:center; }
  .death-panel h2{ color:var(--bad); margin-bottom:4px; }
  .death-panel .epitaph{ color:var(--text-dim); margin-bottom:18px; }
  .stat-summary{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; margin:16px 0; }
  .stat-summary div{ text-align:center; }
  .stat-summary .val{ font-size:1.3rem; font-weight:700; }
  .stat-summary .lbl{ font-size:0.75rem; color:var(--text-dim); }
  .share-box{ margin:18px auto; max-width:480px; text-align:left; background:#161a26; border:1px solid var(--border); border-radius:10px; padding:14px; }
  .share-box h4{ margin:0 0 8px; font-size:0.78rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .share-box textarea{ width:100%; min-height:170px; background:#0f1119; border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'Consolas',Menlo,monospace; font-size:0.82rem; line-height:1.55; padding:10px; resize:vertical; box-sizing:border-box; }
  footer{ text-align:center; color:var(--text-dim); font-size:0.75rem; margin-top:10px; }

  /* cloud save / feedback (optional — game works fully offline without it) */
  .cloud-status{ font-size:0.74rem; color:var(--text-dim); align-self:center; margin-right:auto; }
  .id-choice-btn{ text-align:left; padding:14px; width:100%; }
  .id-choice-btn .sub-desc{ font-size:0.78rem; color:var(--text-dim); margin-top:4px; font-weight:400; }
  .id-skip-btn{ background:transparent; border:none; color:var(--text-dim); font-weight:400; text-decoration:underline; padding:6px; cursor:pointer; font-size:0.8rem; }
  #fb-text{ width:100%; min-height:120px; background:#0f1119; border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:inherit; font-size:0.88rem; padding:10px; resize:vertical; box-sizing:border-box; }
  .fb-type-btn.selected{ border-color:var(--accent); background:#1c2338; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Bloodline</h1>
    <p>A multi-era, multi-generational life sim — prototype build</p>
  </header>
  <div id="screen-setup" class="card"></div>
  <div id="screen-game" class="card" style="display:none;"></div>
  <div id="screen-death" class="card" style="display:none;"></div>
  <div id="tree-overlay" class="tree-overlay"></div>
  <div id="story-overlay" class="story-overlay"></div>
  <div id="cloud-overlay" class="tree-overlay"></div>
  <div id="feedback-overlay" class="tree-overlay"></div>
  <input type="file" id="load-input" accept=".json,application/json" style="display:none;">
  <footer>Prototype v0.5.0 · Bloodline · manual save/load always works; cloud save is optional and off until you choose it</footer>
</div>

<script>
/* =========================================================
   BLOODLINE — prototype life sim engine (v0.2: choice-driven)
   ========================================================= */

const ERAS = [
  { id:'wildwest', name:'The Wild West', years:'1872 – 1899', desc:'Frontier towns, railroads, and hard living.', moneyRange:[5,60] },
  { id:'twenties', name:'The Roaring Twenties', years:'1920 – 1935', desc:'Jazz, bootleggers, and the crash looming ahead.', moneyRange:[10,150] },
  { id:'postwar', name:'The Postwar Boom', years:'1950 – 1968', desc:'Suburbs, factory jobs, and the American dream.', moneyRange:[50,400] },
  { id:'modern', name:'Modern Day', years:'2005 – 2026', desc:'Smartphones, gig work, and student debt.', moneyRange:[100,1200] },
  { id:'future', name:'The Near Future', years:'2061 – 2090', desc:'AI coworkers, climate strain, and orbital tourism.', moneyRange:[200,3000] },
];

const FIRST_NAMES = ['Alex','Jordan','Sam','Riley','Casey','Morgan','Taylor','Jamie','Quinn','Avery','Eli','Nora','Marcus','Della','Otis','June','Frank','Ada','Wyatt','Nova','Grace','Leo','Ruby','Hank'];
const LAST_NAMES = ['Hartley','Voss','Calloway','Reyes','Whitfield','Nakamura','Okafor','Brennan','Solis','Marsh','Kowalski','Delgado','Finch','Ostrander','Callahan'];
const PET_NAMES = ['Rex','Biscuit','Shadow','Duke','Molly','Pepper','Scout','Daisy','Buddy','Ziggy','Copper','Nova-9'];
const PET_SPECIES = {
  wildwest:['dog','barn cat','horse'], twenties:['dog','cat'], postwar:['dog','cat','goldfish'],
  modern:['dog','cat','hamster'], future:['dog','cat','companion-bot'],
};
const TEACHER_NAMES = ['Mr. Aldridge','Mrs. Petrova','Ms. Kwan','Mr. Osei','Mrs. Lindqvist','Mr. Alvarez'];
const BOSS_NAMES = ['Ms. Renner','Mr. Douglas','Mrs. Ibarra','Mr. Choi','Ms. Fontaine'];

const JOB_TITLES = {
  wildwest:['Ranch Hand','Blacksmith','Shopkeeper','Prospector','Telegraph Operator'],
  twenties:['Factory Worker','Speakeasy Manager','Typist','Salesman','Railway Clerk'],
  postwar:['Factory Foreman','Schoolteacher','Office Clerk','Salesman','Engineer'],
  modern:['Software Tester','Barista','Marketing Coordinator','Nurse','Delivery Driver'],
  future:['AI Systems Overseer','Orbital Logistics Tech','Climate Engineer','Bio-Fabricator','Remote Data Analyst'],
};
const TEEN_JOB_TITLES = {
  wildwest:['Stable Hand','Errand Runner','General Store Sweeper'],
  twenties:['Newsboy/Newsgirl','Soda Fountain Clerk','Delivery Runner'],
  postwar:['Soda Jerk','Grocery Bagger','Lawn Mowing Route'],
  modern:['Fast Food Crew','Retail Associate','Lawn Mowing Gig'],
  future:['Drone Delivery Pilot','App-Based Micro-Tasker','Vertical Farm Hand'],
};
// A higher-paying career track that opens up at adulthood for characters who
// built up real smarts as a kid/teen — the concrete version of "smarts should
// gate a widening range of opportunities" rather than just being a stat that
// climbs in isolation.
const ELITE_JOB_TITLES = {
  wildwest:['Assayer','Attorney','Newspaper Editor','Land Surveyor'],
  twenties:['Attorney','Physician','Bank Manager','Investigative Journalist'],
  postwar:['Civil Engineer','Physician','Attorney','University Instructor'],
  modern:['Software Engineer','Physician','Attorney','Data Scientist'],
  future:['Quantum Systems Architect','Orbital Physician','AI Ethicist','Terraform Engineer'],
};
const ELITE_JOB_SMARTS_THRESHOLD = 75;

const SHOP_ITEMS = {
  wildwest:[
    {id:'toy_horse', label:'Wooden toy horse', cost:5, minAge:2, effect:{happiness:6}},
    {id:'pocket_knife', label:'Pocket knife', cost:8, minAge:8, effect:{happiness:4, looks:2}},
    {id:'good_boots', label:'Good pair of boots', cost:18, minAge:10, effect:{looks:5, health:3}},
    {id:'own_horse', label:'A horse of their own', cost:120, minAge:14, effect:{happiness:15, looks:5}},
    {id:'homestead', label:'A small homestead plot', cost:400, minAge:18, effect:{happiness:22}},
  ],
  twenties:[
    {id:'toy_train', label:'Tin toy train', cost:4, minAge:2, effect:{happiness:6}},
    {id:'radio_set', label:'Home radio set', cost:25, minAge:8, effect:{happiness:8, smarts:2}},
    {id:'dance_shoes', label:'Sharp dance shoes', cost:15, minAge:13, effect:{looks:6, happiness:4}},
    {id:'motorcar', label:'A secondhand motorcar', cost:350, minAge:17, effect:{happiness:16, looks:6}},
    {id:'apartment', label:'Lease a city apartment', cost:500, minAge:18, effect:{happiness:20}},
  ],
  postwar:[
    {id:'bicycle', label:'New bicycle', cost:20, minAge:6, effect:{happiness:9, health:3}},
    {id:'record_player', label:'Record player', cost:40, minAge:10, effect:{happiness:7, looks:2}},
    {id:'television', label:'Television set', cost:150, minAge:13, effect:{happiness:10}},
    {id:'used_car', label:'Used car', cost:900, minAge:17, effect:{happiness:16, looks:5}},
    {id:'house_downpayment', label:'House down payment', cost:2500, minAge:21, effect:{happiness:25}},
  ],
  modern:[
    {id:'game_console', label:'Video game console', cost:60, minAge:6, effect:{happiness:10}},
    {id:'smartphone', label:'Smartphone', cost:200, minAge:12, effect:{happiness:9, looks:2}},
    {id:'gaming_pc', label:'Gaming PC', cost:900, minAge:15, effect:{happiness:14, smarts:2}},
    {id:'used_car_modern', label:'Used car', cost:4500, minAge:17, effect:{happiness:16, looks:4}},
    {id:'apartment_deposit', label:'Apartment security deposit', cost:2000, minAge:20, effect:{happiness:22}},
  ],
  future:[
    {id:'holo_toy', label:'Holo-projector toy', cost:15, minAge:2, effect:{happiness:8}},
    {id:'neural_headset', label:'Neural study headset', cost:250, minAge:10, effect:{smarts:6, happiness:4}},
    {id:'grav_board', label:'Gravity board', cost:600, minAge:14, effect:{happiness:14, looks:4}},
    {id:'hovercycle', label:'Personal hovercycle', cost:5000, minAge:17, effect:{happiness:18, looks:6}},
    {id:'orbital_trip', label:'Weekend orbital trip', cost:9000, minAge:20, effect:{happiness:28}},
  ],
};

/* ---------- utils ---------- */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function clamp(v){ return Math.max(0, Math.min(100, v)); }
function firstName(full){ return full.split(' ')[0]; }
function ageBracket(age){
  if(age<=1) return 'infant';
  if(age<=4) return 'toddler';
  if(age<=12) return 'kid';
  if(age<=17) return 'teen';
  if(age<=64) return 'adult';
  return 'senior';
}
function rollRange(r){ return Array.isArray(r) ? randInt(r[0],r[1]) : (r||0); }

/* Anti-repeat text picker: cycles through variants before allowing a repeat */
function pickText(c, key, variants){
  if(!c._usedText) c._usedText = {};
  if(!c._usedText[key]) c._usedText[key] = [];
  let used = c._usedText[key];
  if(used.length >= variants.length) used = c._usedText[key] = [];
  let idx;
  do { idx = randInt(0, variants.length-1); } while(used.includes(idx) && used.length < variants.length);
  used.push(idx);
  return variants[idx];
}

// Teacher/boss names are seeded "Mr./Mrs./Ms. Surname" — splitting on the first
// space like a normal first name would truncate them to just the title.
function displayName(r){
  return (r && (r.role === 'teacher' || r.role === 'boss')) ? r.name : firstName(r ? r.name : '');
}
function fill(template, c, target){
  return template.replace(/{name}/g, firstName(c.name)).replace(/{target}/g, target ? displayName(target) : '');
}

/* ---------- relationships ---------- */
let relCounter = 0;
function addRelationship(c, role, name, extra){
  const rel = Object.assign({ id:'r'+(relCounter++), role, name, closeness: randInt(50,72), active:true }, extra||{});
  c.relationships.push(rel);
  return rel;
}
function relsByRole(c, role){ return c.relationships.filter(r=>r.active && r.role===role); }
function relByRole(c, role){ return relsByRole(c, role)[0]; }

function makeFamily(eraId, surname){
  const rels = [];
  rels.push({role:'mother', name: pick(FIRST_NAMES)+' '+surname});
  rels.push({role:'father', name: pick(FIRST_NAMES)+' '+surname});
  const numSiblings = randInt(0,2);
  for(let i=0;i<numSiblings;i++) rels.push({role:'sibling', name: pick(FIRST_NAMES)+' '+surname});
  const species = pick(PET_SPECIES[eraId]);
  rels.push({role:'pet', name: pick(PET_NAMES), species});
  return { rels };
}

// Family members and future generations should share the player's actual
// last name when they gave one, rather than a disconnected random surname.
function deriveSurname(name){
  const parts = String(name).trim().split(/\s+/);
  return parts.length > 1 ? parts[parts.length - 1] : pick(LAST_NAMES);
}

/* ---------- cumulative Bloodline Score ---------- */
// A blended number across the whole family line (wealth + longevity +
// achievements) — a personal record to try to beat on the next attempt,
// without needing multiplayer or accounts.
function computeBloodlineScore(){
  let score = 0;
  const lives = state.familyLog.slice();
  // Only add state.char separately while alive — once dead, killCharacter()
  // has already recorded them in familyLog, so this avoids double-counting
  // the same life (same dedup rule as buildTreeChain above).
  if(state.char && state.char.alive) lives.push({ money: (state.char.money||0), savings: (state.char.savings||0), age: state.char.age });
  lives.forEach(f=>{
    // Net worth = cash + savings — a life that built up savings shouldn't
    // score lower than one that kept the same amount as loose cash.
    score += Math.round(((f.money||0) + (f.savings||0)) / 100);
    score += (f.age||0) * 3;
  });
  score += (state.achievementsUnlocked ? state.achievementsUnlocked.length : 0) * 25;
  return score;
}

function checkAchievements(){
  if(!state.achievementsUnlocked) state.achievementsUnlocked = [];
  const c = state.char;
  const newlyUnlocked = [];
  ACHIEVEMENTS.forEach(a=>{
    if(state.achievementsUnlocked.includes(a.id)) return;
    let earned = false;
    if(a.scope === 'life' && c) earned = !!a.check(c);
    else if(a.scope === 'family') earned = !!a.check(state);
    if(earned){ state.achievementsUnlocked.push(a.id); newlyUnlocked.push(a); }
  });
  return newlyUnlocked;
}

/* ---------- character creation ---------- */
function newCharacter(eraIndex, name, inherited){
  const era = ERAS[eraIndex];
  const base = { health: randInt(55,85), happiness: randInt(50,80), smarts: randInt(35,70), looks: randInt(35,70), imagination: randInt(25,55) };
  if(inherited && inherited.bonusStat) base[inherited.bonusStat] = clamp(base[inherited.bonusStat] + 15);
  const startMoney = inherited && inherited.money != null ? inherited.money : randInt(...era.moneyRange);
  const surname = deriveSurname(name);
  const fam = makeFamily(era.id, surname);
  const c = {
    name, eraIndex, age:0, stats:base, money:Math.round(startMoney), savings:0,
    job:null, salary:0, alive:true, events:[], generation: state.generation,
    relationships:[], owned:[], actionUsage:{}, surname, _usedText:{},
    skills:{ sports:0, martialArts:0, academic:0, arts:0 },
  };
  fam.rels.forEach(r=>addRelationship(c, r.role, r.name, r.species?{species:r.species}:null));
  return c;
}

/* ---------- effect application ---------- */
function applyEffectSpec(c, spec, rel){
  const deltas = {};
  ['health','happiness','smarts','looks','imagination','money'].forEach(k=>{
    if(spec[k] !== undefined) deltas[k] = rollRange(spec[k]);
  });
  if(spec.health) c.stats.health = clamp(c.stats.health + deltas.health);
  if(spec.happiness) c.stats.happiness = clamp(c.stats.happiness + deltas.happiness);
  if(spec.smarts) c.stats.smarts = clamp(c.stats.smarts + deltas.smarts);
  if(spec.looks) c.stats.looks = clamp(c.stats.looks + deltas.looks);
  if(spec.imagination) c.stats.imagination = clamp((c.stats.imagination||0) + deltas.imagination);
  if(spec.money) c.money = Math.max(0, Math.round(c.money + deltas.money));
  if(rel && spec.closeness !== undefined){
    rel.closeness = clamp(rel.closeness + rollRange(spec.closeness));
  } else if(rel){
    rel.closeness = clamp(rel.closeness + 3); // small default bump for any interaction
  }
  return deltas;
}

function logEvent(c, text, cls, milestone, legendary){
  c.events.unshift({ text, cls: milestone ? 'milestone' : (cls||''), tag:`Age ${c.age}`, legendary: !!legendary });
}

function eventClassFromDeltas(d){
  const total = (d.health||0)+(d.happiness||0)+(d.smarts||0)+(d.looks||0)+((d.money||0)/10);
  if(total > 1) return 'good';
  if(total < -1) return 'bad';
  return '';
}

/* ---------- economy: savings interest + investing ---------- */
const ERA_INTEREST_RATE = { wildwest:0.015, twenties:0.02, postwar:0.025, modern:0.02, future:0.03 };
function applyEconomyInterest(c){
  if(c.savings > 0){
    const rate = ERA_INTEREST_RATE[ERAS[c.eraIndex].id] || 0.02;
    c.savings += Math.max(1, Math.round(c.savings * rate));
  }
}
// Weighted random investment outcome — mostly modest, occasionally a big win or a real loss.
function investOutcome(){
  const roll = Math.random();
  if(roll < 0.30) return { mult: -(randInt(30,70)/100), tag:'bad' };
  if(roll < 0.65) return { mult: (randInt(-10,10)/100), tag:'flat' };
  if(roll < 0.92) return { mult: (randInt(20,80)/100), tag:'good' };
  return { mult: (randInt(90,200)/100), tag:'great' };
}

/* ---------- skill progression ---------- */
// Real rank/level progression instead of a flat stat bump — tied to repeated
// practice of the same action, not a generic number going up in isolation.
const SKILL_ACTION_MAP = {
  join_sport:'sports', varsity:'sports',
  martial_arts:'martialArts', martial_arts_t:'martialArts',
  study:'academic', study_hard:'academic', take_class:'academic',
  join_arts:'arts', band_arts:'arts',
};
const SPORTS_TIERS = ['Beginner','Developing','Solid Player','Skilled','Standout','Elite'];
const MARTIAL_ARTS_BELTS = ['White Belt','Yellow Belt','Orange Belt','Green Belt','Blue Belt','Purple Belt','Brown Belt','Black Belt'];
const ACADEMIC_TIERS = ['No Focus','Developing Student','Solid Student','Honor Student','Scholar','Prodigy'];
const ARTS_TIERS = ['Just Starting','Developing Talent','Skilled Creative','Accomplished Artist','Standout Talent','Master Artist'];
function skillTier(tiers, reps, perTier){
  const idx = Math.min(tiers.length - 1, Math.floor((reps||0) / perTier));
  return tiers[idx];
}
function recordSkillPractice(c, actionId){
  const key = SKILL_ACTION_MAP[actionId];
  if(!key) return;
  if(!c.skills) c.skills = { sports:0, martialArts:0, academic:0, arts:0 };
  c.skills[key] = (c.skills[key]||0) + 1;
}
function skillsHtml(c){
  if(!c.skills) return '';
  const rows = [];
  if(c.skills.sports > 0) rows.push(`<div>Sports: <strong>${skillTier(SPORTS_TIERS, c.skills.sports, 4)}</strong></div>`);
  if(c.skills.martialArts > 0) rows.push(`<div>Martial Arts: <strong>${skillTier(MARTIAL_ARTS_BELTS, c.skills.martialArts, 3)}</strong></div>`);
  if(c.skills.academic > 0) rows.push(`<div>Academic Track: <strong>${skillTier(ACADEMIC_TIERS, c.skills.academic, 4)}</strong></div>`);
  if((c.skills.arts||0) > 0) rows.push(`<div>Arts: <strong>${skillTier(ARTS_TIERS, c.skills.arts, 4)}</strong></div>`);
  if(!rows.length) return '';
  return `<div class="skills-box divider"><h4>Skills</h4>${rows.join('')}</div>`;
}

/* ---------- special action handlers ---------- */
function handleSpecial(c, special, action){
  const era = ERAS[c.eraIndex];
  if(special === 'make_friend' && !relByRole(c,'bestfriend')){
    const name = pick(FIRST_NAMES)+' '+pick(LAST_NAMES);
    addRelationship(c, 'bestfriend', name);
    logEvent(c, `${firstName(c.name)} became close friends with ${firstName(name)}.`, 'good');
  } else if(special === 'find_partner' && !relByRole(c,'partner')){
    const name = pick(FIRST_NAMES)+' '+pick(LAST_NAMES);
    addRelationship(c, 'partner', name);
    logEvent(c, `${firstName(c.name)} started seeing ${firstName(name)}.`, 'good');
  } else if(special === 'teen_job' && !c.job){
    const title = pick(TEEN_JOB_TITLES[era.id]);
    c.job = title; c.salary = randInt(8,25);
    addRelationship(c, 'boss', pick(BOSS_NAMES));
    logEvent(c, `${firstName(c.name)} got a part-time job as a ${title}.`, 'good');
  } else if(special === 'deposit_savings'){
    const maxAmt = Math.floor(c.money);
    if(maxAmt < 1){
      logEvent(c, `${firstName(c.name)} didn't have any spare cash to put away this year.`, '');
    } else {
      // Player picks the amount now instead of a fixed 50% — clamped to
      // what's actually on hand so this can never go negative.
      const input = prompt(`How much would you like to move into savings? (You have $${maxAmt.toLocaleString()} on hand)`, String(Math.floor(maxAmt * 0.5)));
      const amount = Math.min(maxAmt, Math.max(0, Math.floor(Number(input))));
      if(input === null || !amount || isNaN(amount)){
        logEvent(c, `${firstName(c.name)} thought about saving some money but didn't get around to it.`, '');
      } else {
        c.money -= amount; c.savings = (c.savings||0) + amount;
        logEvent(c, `${firstName(c.name)} tucked $${amount.toLocaleString()} away into savings.`, 'good');
      }
    }
  } else if(special === 'withdraw_savings'){
    const maxAmt = Math.floor(c.savings || 0);
    if(maxAmt <= 0){
      logEvent(c, `${firstName(c.name)} checked their savings — there wasn't anything there yet.`, '');
    } else {
      const input = prompt(`How much would you like to withdraw from savings? (You have $${maxAmt.toLocaleString()} saved)`, String(maxAmt));
      const amount = Math.min(maxAmt, Math.max(0, Math.floor(Number(input))));
      if(input === null || !amount || isNaN(amount)){
        logEvent(c, `${firstName(c.name)} decided to leave their savings alone for now.`, '');
      } else {
        c.savings -= amount; c.money += amount;
        logEvent(c, `${firstName(c.name)} pulled $${amount.toLocaleString()} out of savings.`, '');
      }
    }
  } else if(special === 'marry' && action && action.rel && !action.rel.married){
    action.rel.married = true;
    action.rel.closeness = clamp(action.rel.closeness + 15);
    logEvent(c, `${firstName(c.name)} and ${firstName(action.rel.name)} got married!`, 'good', true);
  } else if(special === 'invest'){
    const stake = (action && action.cost) || 0;
    const outcome = investOutcome();
    const change = Math.round(stake * outcome.mult);
    // The stake was already deducted from money as this action's cost before
    // handleSpecial ran (see performAction). Investing should return principal
    // plus gain/loss, not just the gain on top of an already-spent stake — the
    // old version made "good"/"flat" outcomes net losses despite the message
    // saying the investment "paid off." Net effect on money is now exactly `change`.
    c.money = Math.max(0, c.money + stake + change);
    let text;
    if(outcome.tag === 'bad') text = `${firstName(c.name)}'s investment went south — lost $${Math.abs(change)}.`;
    else if(outcome.tag === 'flat') text = `${firstName(c.name)}'s investment barely moved either way.`;
    else if(outcome.tag === 'good') text = `${firstName(c.name)}'s investment paid off nicely — up $${change}.`;
    else { text = `${firstName(c.name)}'s investment paid off big — up $${change}!`; c.hadGreatInvestment = true; }
    logEvent(c, text, change > 5 ? 'good' : (change < -5 ? 'bad' : ''));
  }
}

/* ---------- building the action menu ---------- */
function buildActionMenu(c){
  const bracket = ageBracket(c.age);
  const era = ERAS[c.eraIndex];
  const actions = [];

  c.relationships.filter(r=>r.active).forEach(rel=>{
    const defs = ROLE_ACTIONS[rel.role] || [];
    defs.forEach(def=>{
      if(def.minAge && c.age < def.minAge) return;
      if(def.maxAge && c.age > def.maxAge) return;
      if(def.special === 'marry' && rel.married) return;
      actions.push({ def, rel, key: def.id+'_'+rel.id,
        label: fill(def.label, c, rel), category: def.category, cost: def.cost||0 });
    });
  });

  (BRACKET_ACTIONS[bracket]||[]).forEach(def=>{
    if(def.special === 'find_partner' && relByRole(c,'partner')) return;
    if(def.special === 'make_friend' && relByRole(c,'bestfriend')) return;
    if(def.special === 'teen_job' && c.job) return;
    if(def.minAge && c.age < def.minAge) return;
    // minSmarts/minImagination: content that only opens up once a character
    // has built up that stat, so smarts/imagination gate real opportunities
    // instead of just being numbers that go up in isolation.
    if(def.minSmarts && (c.stats.smarts||0) < def.minSmarts) return;
    if(def.minImagination && (c.stats.imagination||0) < def.minImagination) return;
    actions.push({ def, rel:null, key: def.id, label: fill(def.label, c, null), category: def.category, cost: def.cost||0 });
  });

  const eraDefs = (ERA_BRACKET_ACTIONS[era.id]||{})[bracket] || [];
  eraDefs.forEach(def=>{
    actions.push({ def, rel:null, key: def.id, label: fill(def.label, c, null), category: def.category, cost: def.cost||0 });
  });

  if(bracket === 'adult'){
    BRACKET_ACTIONS.adult.forEach(()=>{}); // no-op, already added above
  }

  (SHOP_ITEMS[era.id]||[]).forEach(item=>{
    if(c.age < item.minAge || c.owned.includes(item.id)) return;
    actions.push({
      shopItem:item, rel:null, key:'buy_'+item.id,
      label:`Buy: ${item.label}`, category:'Shop', cost:item.cost,
    });
  });

  return actions;
}

// Categories that represent skill-building / academic practice can be repeated
// up to 5x per year; everything else can be chosen once per year (but every
// available option can be chosen, not just a handful).
const SKILL_CATEGORIES = ['School', 'Activities', 'Growth'];
function actionCap(category){ return SKILL_CATEGORIES.includes(category) ? 5 : 1; }
function actionUsageCount(c, key){ return c.actionUsage[key] || 0; }

function performAction(c, action){
  const cap = actionCap(action.category);
  const used = actionUsageCount(c, action.key);
  if(used >= cap) return;
  if(action.cost && c.money < action.cost) return;
  const def = action.def;

  if(action.shopItem){
    c.money -= action.cost;
    c.owned.push(action.shopItem.id);
    applyEffectSpec(c, action.shopItem.effect, null);
    logEvent(c, `${firstName(c.name)} bought ${action.shopItem.label.toLowerCase()}.`, 'good');
    c.actionUsage[action.key] = used + 1;
    renderGame();
    return;
  }

  if(action.cost) c.money = Math.max(0, c.money - action.cost);
  const deltas = applyEffectSpec(c, def.effect || {}, action.rel);
  if(def.special){
    handleSpecial(c, def.special, action);
  } else if(def.requiresJob && !c.job){
    // no job, action fizzles softly
    logEvent(c, `${firstName(c.name)} looked for extra work but didn't have a job to lean on.`, '');
  } else if(def.texts && def.texts.length){
    const text = fill(pickText(c, def.id+(action.rel?('_'+action.rel.id):''), def.texts), c, action.rel);
    logEvent(c, text, eventClassFromDeltas(deltas));
  }
  recordSkillPractice(c, def.id);
  c.actionUsage[action.key] = used + 1;
  renderGame();
}

/* ---------- milestones & aging ---------- */
function applyMilestones(c){
  const era = ERAS[c.eraIndex];
  if(c.age === 0){ logEvent(c, `${firstName(c.name)} was born.`, '', true); }
  if(c.age === 1){
    logEvent(c, `${firstName(c.name)} took their first steps.`, '', true);
    logEvent(c, `${firstName(c.name)} said their first word.`, '', true);
  }
  if(c.age === 5){
    logEvent(c, `${firstName(c.name)} started school.`, '', true);
    if(!relByRole(c,'teacher')) addRelationship(c, 'teacher', pick(TEACHER_NAMES));
    if(!relByRole(c,'bestfriend')) addRelationship(c, 'bestfriend', pick(FIRST_NAMES)+' '+pick(LAST_NAMES));
  }
  if(c.age === 18){
    c.relationships.filter(r=>r.role==='teacher').forEach(r=>r.active=false);
    const highSmarts = (c.stats.smarts||0) >= ELITE_JOB_SMARTS_THRESHOLD;
    const titlePool = highSmarts ? (ELITE_JOB_TITLES[era.id] || JOB_TITLES[era.id]) : JOB_TITLES[era.id];
    const title = pick(titlePool);
    c.job = title;
    c.salary = randInt(...era.moneyRange) * (highSmarts ? 0.9 : 0.6) + 20;
    c.salary = Math.round(c.salary);
    if(!relByRole(c,'boss')) addRelationship(c, 'boss', pick(BOSS_NAMES));
    addRelationship(c, 'coworker', pick(FIRST_NAMES)+' '+pick(LAST_NAMES));
    const msg = highSmarts
      ? `${firstName(c.name)}'s smarts opened doors — they became an adult and landed a competitive job as a ${title}.`
      : `${firstName(c.name)} became an adult and took a job as a ${title}.`;
    logEvent(c, msg, '', true);
  }
  if(c.age === 65 && c.job){
    logEvent(c, `${firstName(c.name)} retired after years as a ${c.job}.`, '', true);
    c.job = null;
    c.relationships.filter(r=>r.role==='boss'||r.role==='coworker').forEach(r=>r.active=false);
  }
}

function deathCheck(c){
  if(c.stats.health <= 0) return true;
  let chance = 0;
  if(c.age > 60) chance += (c.age-60) * 0.012;
  chance += 0.004;
  if(c.stats.health < 25) chance += 0.05;
  return Math.random() < chance;
}

/* ---------- turn resolution: 6-month / 1-year time-skip ---------- */
// c.monthsIntoYear tracks progress toward completing the current age year
// (0 or 6; undefined on older saves is treated as 0). Advancing 6 months that
// doesn't cross into a new year is a lighter "check-in" turn — no salary, no
// milestones, no legendary/story roll, just a fresh set of actions and a
// smaller chance of an ordinary event. Advancing into a new year (either via
// a 1-year jump, or a second 6-month step) runs the full year-end resolution.
function advanceTurn(months){
  const c = state.char;
  if(!c || !c.alive) return;
  c.monthsIntoYear = (c.monthsIntoYear||0) + months;
  if(c.monthsIntoYear >= 12){
    c.monthsIntoYear -= 12;
    c.age += 1;
    completeYear(c);
  } else {
    partialAdvance(c);
  }
}

function partialAdvance(c){
  const bracket = ageBracket(c.age);
  const pool = worldEventPool(ERAS[c.eraIndex].id, bracket);
  if(pool.length && Math.random() < 0.25){
    const ev = pick(pool);
    const deltas = applyEffectSpec(c, ev.e, null);
    if(ev.special) handleSpecial(c, ev.special);
    logEvent(c, fill(ev.t, c, null), eventClassFromDeltas(deltas));
  }
  c.actionUsage = {};
  renderGame();
}

function completeYear(c){
  if(c.job && c.age >= 18) c.money += c.salary;
  if(c.age > 60) c.stats.health = clamp(c.stats.health - randInt(1,4));
  applyEconomyInterest(c);

  // relationship decay if neglected — mild, keeps the system meaningful
  c.relationships.filter(r=>r.active).forEach(r=>{ r.closeness = clamp(r.closeness - randInt(1,3)); });

  const bracket = ageBracket(c.age);

  // Branching mini-storyline roll — pauses year-end resolution until the
  // player chooses, and stands in for this year's normal world event (a
  // story IS the year's event, not an addition on top of it).
  if(STORY_BRACKETS.includes(bracket) && Math.random() < STORY_CHANCE){
    const storyPool = storiesFor(bracket, ERAS[c.eraIndex].id);
    if(storyPool.length){
      openStoryModal(c, pick(storyPool), () => finishYear(c));
      return;
    }
  }

  runWorldEventAndLegendary(c, bracket);
  finishYear(c);
}

function runWorldEventAndLegendary(c, bracket){
  const pool = worldEventPool(ERAS[c.eraIndex].id, bracket);
  if(pool.length && Math.random() < 0.55){
    const ev = pick(pool);
    const deltas = applyEffectSpec(c, ev.e, null);
    if(ev.special) handleSpecial(c, ev.special);
    logEvent(c, fill(ev.t, c, null), eventClassFromDeltas(deltas));
  }

  // Rare legendary event roll — independent of the regular world-event roll,
  // so a memorable life beat can land even in an otherwise quiet year.
  if(LEGENDARY_BRACKETS.includes(bracket) && Math.random() < LEGENDARY_CHANCE){
    const legendaryPool = LEGENDARY_EVENTS[ERAS[c.eraIndex].id] || [];
    if(legendaryPool.length){
      const lev = pick(legendaryPool);
      applyEffectSpec(c, lev.e, null);
      logEvent(c, fill(lev.t, c, null), lev.cls, false, true);
    }
  }
}

function finishYear(c){
  applyMilestones(c);
  c.actionUsage = {};
  if(deathCheck(c)){ killCharacter(c); return; }
  cloudAutosave(); // one save per completed year — plenty often, not a network call per click
  renderGame();
}

function killCharacter(c){
  c.alive = false;
  const causes = c.stats.health<=0 ? ['a long illness','failing health','a fading heart'] : ['old age','a sudden accident','an unexpected turn'];
  c.causeOfDeath = pick(causes);
  checkAchievements(); // one final check against this life before it's recorded
  state.familyLog.push({
    gen:c.generation, name:c.name, era:ERAS[c.eraIndex].name, eraId:ERAS[c.eraIndex].id,
    age:c.age, money:c.money, savings:c.savings||0, peakStat: topStat(c), causeOfDeath:c.causeOfDeath, highlight: topHighlightText(c),
  });
  trackEvent('life_ended', { bloodlineScore: computeBloodlineScore(), achievementsUnlocked: state.achievementsUnlocked || [] });
  cloudAutosave();
  renderDeath(c);
}
function topStat(c){ const e=Object.entries(c.stats); e.sort((a,b)=>b[1]-a[1]); return e[0][0]; }

// The single most shareable moment from a finished life — legendary events win,
// otherwise the first notable good/bad event. Used by the family tree view.
function topHighlightText(c){
  const legendaryEvent = c.events.find(e => e.legendary);
  if(legendaryEvent) return legendaryEvent.text;
  const notableEvent = c.events.find(e => e.cls === 'good' || e.cls === 'bad');
  return notableEvent ? notableEvent.text : null;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// Builds a plain-text, screenshot/paste-friendly summary of a finished life —
// designed to be the thing a player actually shares with a friend.
// Legendary moments are the most shareable, so they lead the highlight reel —
// shared by the text share, the image share, and the family tree's quote.
function topShareHighlights(c, n){
  const legendaryHighlights = c.events.filter(e => e.legendary).map(e => e.text);
  const otherHighlights = c.events.filter(e => !e.legendary && (e.cls === 'good' || e.cls === 'bad')).map(e => e.text);
  return legendaryHighlights.concat(otherHighlights).slice(0, n);
}

function generateShareText(c){
  const era = ERAS[c.eraIndex];
  const highlights = topShareHighlights(c, 3);
  const surname = c.surname || c.name.split(' ').slice(-1)[0];
  const totalEstate = (c.money||0) + (c.savings||0);
  const lines = [];
  lines.push('🩸 BLOODLINE');
  lines.push(`${c.name} — ${era.name} (${era.years})`);
  lines.push(`Age ${c.age} • ${c.job ? c.job : 'no steady job'} • Died of ${c.causeOfDeath}`);
  lines.push(`Left $${totalEstate.toLocaleString()} to the next generation`);
  if(highlights.length){
    lines.push('');
    lines.push('Life highlights:');
    highlights.forEach(h => lines.push(`• ${h}`));
  }
  lines.push('');
  lines.push(`Generation ${c.generation} of the ${surname} bloodline.`);
  lines.push('Play yours → https://bloodline-game.netlify.app');
  return lines.join('\n');
}

/* ---------- downloadable share image (v2 of the share feature) ---------- */
function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(w=>{
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  });
  if(line) lines.push(line);
  return lines;
}
// Redraws the same avatar design as the SVG version, using canvas primitives
// (canvas can't render live SVG synchronously without an async image load),
// so the downloadable card matches what's shown in the game.
function drawAvatarOnCanvas(ctx, cx, cy, radius, c, theme){
  const grad = ctx.createRadialGradient(cx - radius*0.3, cy - radius*0.4, radius*0.1, cx, cy, radius);
  grad.addColorStop(0, theme.b);
  grad.addColorStop(1, theme.a);
  ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();

  const looks = (c.stats && c.stats.looks) || 50;
  if(looks >= 40){
    const lw = looks >= 80 ? 6 : looks >= 60 ? 4 : 2;
    ctx.lineWidth = lw; ctx.strokeStyle = '#f2c94c';
    ctx.beginPath(); ctx.arc(cx, cy, radius - lw/2, 0, Math.PI*2); ctx.stroke();
  }

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, radius - 2, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  const bracket = ageBracket(c.age);
  const P = AVATAR_PROPORTIONS[bracket];
  const scale = (radius*2)/100;
  const originX = cx - radius, originY = cy - radius;
  ctx.beginPath();
  ctx.ellipse(originX + 50*scale, originY + P.bodyCy*scale, P.bodyRx*scale, P.bodyRy*scale, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(originX + 50*scale, originY + P.headCy*scale, P.headR*scale, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function generateShareCanvas(c){
  const canvas = document.createElement('canvas');
  canvas.width = 900; canvas.height = 1200;
  const ctx = canvas.getContext('2d');
  const era = ERAS[c.eraIndex];
  const theme = ERA_THEME[era.id] || DEFAULT_THEME;

  const bgGrad = ctx.createLinearGradient(0,0,0,canvas.height);
  bgGrad.addColorStop(0, '#1c2130'); bgGrad.addColorStop(1, '#0f1119');
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,canvas.width,canvas.height);

  const topGrad = ctx.createLinearGradient(0,0,canvas.width,0);
  topGrad.addColorStop(0, theme.a); topGrad.addColorStop(1, theme.b);
  ctx.fillStyle = topGrad; ctx.fillRect(0,0,canvas.width,14);

  let y = 90;
  ctx.textAlign = 'center';
  ctx.fillStyle = theme.b;
  ctx.font = '700 32px "Segoe UI", Arial, sans-serif';
  ctx.fillText('🩸 BLOODLINE', canvas.width/2, y);

  y += 100;
  drawAvatarOnCanvas(ctx, canvas.width/2, y, 90, c, theme);

  y += 140;
  ctx.fillStyle = '#e9ebf2';
  ctx.font = '700 40px "Segoe UI", Arial, sans-serif';
  ctx.fillText(c.name, canvas.width/2, y);

  y += 42;
  ctx.fillStyle = '#9aa1b4';
  ctx.font = '400 22px "Segoe UI", Arial, sans-serif';
  ctx.fillText(`${era.name} (${era.years})`, canvas.width/2, y);

  y += 40;
  ctx.font = '400 22px "Segoe UI", Arial, sans-serif';
  ctx.fillText(`Age ${c.age} · ${c.job || 'no steady job'} · Died of ${c.causeOfDeath}`, canvas.width/2, y);

  y += 44;
  ctx.fillStyle = '#4fd18b';
  ctx.font = '700 26px "Segoe UI", Arial, sans-serif';
  const totalEstateImg = (c.money||0) + (c.savings||0);
  ctx.fillText(`Left $${totalEstateImg.toLocaleString()} to the next generation`, canvas.width/2, y);

  const highlights = topShareHighlights(c, 3);
  y += 60;
  if(highlights.length){
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e9ebf2';
    ctx.font = '700 22px "Segoe UI", Arial, sans-serif';
    ctx.fillText('Life highlights', 70, y);
    y += 34;
    ctx.font = '400 20px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#c7cbdb';
    highlights.forEach(h=>{
      const lines = wrapCanvasText(ctx, '• ' + h, canvas.width - 140);
      lines.forEach(line=>{ ctx.fillText(line, 70, y); y += 28; });
      y += 8;
    });
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9aa1b4';
  ctx.font = '400 20px "Segoe UI", Arial, sans-serif';
  const surname = c.surname || c.name.split(' ').slice(-1)[0];
  ctx.fillText(`Generation ${c.generation} of the ${surname} bloodline`, canvas.width/2, canvas.height - 70);
  ctx.fillStyle = theme.b;
  ctx.font = '700 22px "Segoe UI", Arial, sans-serif';
  ctx.fillText('Play yours → bloodline-game.netlify.app', canvas.width/2, canvas.height - 34);

  return canvas;
}
function downloadShareImage(c){
  const canvas = generateShareCanvas(c);
  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  const safeName = c.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  a.href = url; a.download = `bloodline-${safeName}-age${c.age}.png`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ---------- family tree view ---------- */
// Distinct accent per era so the tree reads as a visual timeline, not a text list.
const ERA_COLORS = { wildwest:'#c98b5c', twenties:'#c98bff', postwar:'#4fd18b', modern:'#7c9eff', future:'#4cd7f2' };
function eraIdFromName(name){ const found = ERAS.find(e=>e.name===name); return found ? found.id : ERAS[0].id; }

/* ---------- per-era visual theming ---------- */
// Each era gets its own two-color accent gradient, applied as CSS custom
// properties, so the header/buttons/highlights subtly shift with the setting
// instead of every era looking identical.
const ERA_THEME = {
  wildwest:{ a:'#c98b5c', b:'#e0b48c', glow:'#3a2c1f' },
  twenties:{ a:'#c98bff', b:'#7c9eff', glow:'#241f3a' },
  postwar:{ a:'#4fd18b', b:'#7ee8ac', glow:'#1a2e22' },
  modern:{ a:'#7c9eff', b:'#c98bff', glow:'#232a3d' },
  future:{ a:'#4cd7f2', b:'#7c9eff', glow:'#152a33' },
};
const DEFAULT_THEME = { a:'#7c9eff', b:'#c98bff', glow:'#232a3d' };
function applyEraTheme(eraId){
  const t = ERA_THEME[eraId] || DEFAULT_THEME;
  document.documentElement.style.setProperty('--accent', t.a);
  document.documentElement.style.setProperty('--accent-2', t.b);
  document.documentElement.style.setProperty('--bg-glow', t.glow || DEFAULT_THEME.glow);
}
function resetTheme(){
  document.documentElement.style.setProperty('--accent', DEFAULT_THEME.a);
  document.documentElement.style.setProperty('--accent-2', DEFAULT_THEME.b);
  document.documentElement.style.setProperty('--bg-glow', DEFAULT_THEME.glow);
}

/* ---------- character avatar ---------- */
// Deliberately abstract, not a literal illustration: an era-tinted medallion
// with a neutral silhouette bust that resizes by age bracket, plus a gold
// ring that appears as the Looks stat climbs. Makes the character read as
// someone rather than just a stat sheet, without attempting real portraiture.
let avatarIdCounter = 0;
const AVATAR_PROPORTIONS = {
  infant:{ headR:24, headCy:46, bodyRy:22, bodyCy:88, bodyRx:26 },
  toddler:{ headR:21, headCy:42, bodyRy:24, bodyCy:90, bodyRx:28 },
  kid:{ headR:18, headCy:38, bodyRy:26, bodyCy:92, bodyRx:30 },
  teen:{ headR:16, headCy:35, bodyRy:28, bodyCy:94, bodyRx:32 },
  adult:{ headR:15, headCy:34, bodyRy:29, bodyCy:95, bodyRx:33 },
  senior:{ headR:15, headCy:36, bodyRy:27, bodyCy:94, bodyRx:31 },
};
function avatarSVG(c, size){
  size = size || 64;
  const uid = 'av' + (avatarIdCounter++);
  const bracket = ageBracket(c.age);
  const eraId = c.eraId || ERAS[c.eraIndex].id;
  const theme = ERA_THEME[eraId] || DEFAULT_THEME;
  const looks = (c.stats && c.stats.looks) || 50;
  const P = AVATAR_PROPORTIONS[bracket];
  const ringWidth = looks >= 80 ? 4 : looks >= 60 ? 2.5 : looks >= 40 ? 1 : 0;
  const ringColor = looks >= 40 ? '#f2c94c' : 'transparent';
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" class="avatar-svg">
      <defs>
        <radialGradient id="${uid}g" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="${theme.b}"/>
          <stop offset="100%" stop-color="${theme.a}"/>
        </radialGradient>
        <clipPath id="${uid}c"><circle cx="50" cy="50" r="46"/></clipPath>
      </defs>
      <circle cx="50" cy="50" r="48" fill="url(#${uid}g)" stroke="${ringColor}" stroke-width="${ringWidth}"/>
      <g clip-path="url(#${uid}c)">
        <ellipse cx="50" cy="${P.bodyCy}" rx="${P.bodyRx}" ry="${P.bodyRy}" fill="rgba(255,255,255,0.92)"/>
        <circle cx="50" cy="${P.headCy}" r="${P.headR}" fill="rgba(255,255,255,0.92)"/>
        ${bracket==='senior' ? `<circle cx="50" cy="${P.headCy}" r="${P.headR+4}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>` : ''}
      </g>
    </svg>`;
}

function treeSurname(){
  if(state.char && state.char.surname) return state.char.surname;
  if(state.familyLog.length){
    const last = state.familyLog[state.familyLog.length-1];
    return last.name.split(' ').slice(-1)[0];
  }
  return '';
}

// The chain is linear (one child inherits at a time), not branching — but it's
// still the family's whole story, oldest ancestor first, current life last.
function buildTreeChain(){
  const chain = state.familyLog.map(f => ({ ...f, alive:false }));
  // Only append state.char separately while they're still alive — once they've
  // died, killCharacter() has already recorded them in familyLog, so adding
  // them again here would show the same life twice.
  if(state.char && state.char.alive){
    chain.push({
      gen: state.char.generation, name: state.char.name, era: ERAS[state.char.eraIndex].name,
      eraId: ERAS[state.char.eraIndex].id, age: state.char.age, money: state.char.money, savings: state.char.savings||0,
      peakStat: topStat(state.char), causeOfDeath: null,
      highlight: topHighlightText(state.char), alive: true,
    });
  }
  return chain;
}

const TRAIT_LABEL = {health:'Health',happiness:'Happiness',smarts:'Smarts',looks:'Looks'};

function treeNodeHtml(f){
  const eraId = f.eraId || eraIdFromName(f.era);
  const color = ERA_COLORS[eraId] || 'var(--accent)';
  const traitLabel = TRAIT_LABEL[f.peakStat] || f.peakStat;
  const totalLeft = (f.money||0) + (f.savings||0);
  const detailLine = f.alive
    ? `Age ${f.age} · still writing their story`
    : `Lived to ${f.age} · died of ${f.causeOfDeath || 'unknown causes'} · left $${totalLeft.toLocaleString()}`;
  const traitChip = traitLabel ? `<span class="tn-trait">Defining trait: ${traitLabel}</span>` : '';
  const highlightLine = f.highlight ? `<div class="tn-detail tn-quote">"${escapeHtml(f.highlight)}"</div>` : '';
  return `
    <div class="tree-node${f.alive ? ' current' : ''}" style="--node-color:${color};">
      <div class="tn-top">
        <span class="tn-name-row">${avatarSVG(f, 34)}<span class="tn-name">${escapeHtml(f.name)}</span></span>
        <span class="tn-gen">Gen ${f.gen}</span>
      </div>
      <div class="tn-era">${escapeHtml(f.era)}${f.alive ? ' · currently living' : ''}</div>
      <div class="tn-detail">${detailLine}</div>
      ${traitChip}
      ${highlightLine}
    </div>`;
}

function openFamilyTree(){
  const overlay = document.getElementById('tree-overlay');
  const chain = buildTreeChain();
  const surname = treeSurname();
  overlay.innerHTML = `
    <div class="tree-panel">
      <button class="tree-close" id="tree-close-btn" aria-label="Close">✕</button>
      <h2 style="margin-top:0;">Family Tree</h2>
      <div class="tree-sub">${chain.length} generation${chain.length===1?'':'s'}${surname ? ` of the ${escapeHtml(surname)} bloodline` : ''} · Bloodline Score: ${computeBloodlineScore().toLocaleString()}</div>
      ${chain.length ? `<div class="tree-chain">${chain.map(treeNodeHtml).join('')}</div>` : '<div class="tree-empty">No ancestors yet — you\'re the first.</div>'}
    </div>`;
  overlay.style.display = 'flex';
  document.getElementById('tree-close-btn').onclick = closeFamilyTree;
  overlay.onclick = (e)=>{ if(e.target === overlay) closeFamilyTree(); };
}

function closeFamilyTree(){
  const overlay = document.getElementById('tree-overlay');
  overlay.style.display = 'none';
  overlay.innerHTML = '';
}

/* ---------- state ---------- */
let state = { generation:1, familyLog:[], char:null };

/* ---------- rendering ---------- */
const setupEl = document.getElementById('screen-setup');
const gameEl = document.getElementById('screen-game');
const deathEl = document.getElementById('screen-death');
let selectedEra = 0;

function renderSetup(){
  gameEl.style.display='none'; deathEl.style.display='none'; setupEl.style.display='block';

    <h2 style="margin-top:0;">Start a Bloodline</h2>
